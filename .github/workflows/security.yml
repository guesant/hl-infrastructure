name: security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tool image
        run: docker build --target gitleaks -t hl-infra/gitleaks .tools/docker

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/gitleaks
          detect --source /repo --config /repo/.config/gitleaks.toml
          --gitleaks-ignore-path /repo/.config/gitleaksignore --redact
          --report-format sarif --report-path gitleaks.sarif -v

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: gitleaks.sarif

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build --target osv-scanner -t hl-infra/osv-scanner .tools/docker

      - name: osv-scanner
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/osv-scanner
          scan source --recursive --experimental-exclude rendered --allow-no-lockfiles /repo

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build --target trivy -t hl-infra/trivy .tools/docker

      - name: trivy fs
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/trivy
          fs --scanners vuln,secret --skip-dirs rendered /repo
