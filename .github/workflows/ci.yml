name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint sh rhysd/actionlint:1.7.12
          -c "actionlint -color .github/workflows/*.yml"

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: yamllint
          smoke: --version

      - name: yamllint
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/yamllint -c .config/yamllint.yml .

  ansible-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ansible-lint
          smoke: --version

      - name: ansible-lint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo -e ANSIBLE_COLLECTIONS_PATH=/tmp/collections
          --entrypoint sh hl-infra/ansible-lint
          -c "ansible-galaxy collection install -r ansible/requirements.yml -p /tmp/collections >/dev/null && ansible-lint -c .config/ansible-lint.yml"

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shellcheck
          smoke: --version

      - name: shellcheck
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/shellcheck .tools/*.sh

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: hadolint
          smoke: --version

      - name: hadolint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/hadolint
          --ignore DL3008 --ignore DL3018 .tools/docker/Dockerfile

  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: markdownlint
          smoke: markdownlint-cli2 --version

      - name: markdownlint-cli2
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/markdownlint
          markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc
          README.md SECURITY.md SUPPORT.md CONTRIBUTING.md 'docs/**/*.md'

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: helm lint
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/lint-charts.sh

  prose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: No em dash, en dash or Unicode arrow
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-prose.sh

  docs-consistency:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Pages reviewed after their sources changed
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          --entrypoint bash hl-infra/shell .tools/check-doc-drift.sh

      - name: Every role is documented
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-roles-documented.sh

  spelling:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: cspell
          smoke: --version

      - name: cspell
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/cspell --config .config/cspell.yaml --no-progress

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: gitleaks
          smoke: version

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/gitleaks
          detect --source /repo --config /repo/.config/gitleaks.toml
          --gitleaks-ignore-path /repo/.config/gitleaksignore --redact
          --report-format sarif --report-path gitleaks.sarif -v

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gitleaks.sarif

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: osv-scanner
          smoke: --version

      - name: osv-scanner
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/osv-scanner
          scan source --recursive --experimental-exclude rendered --allow-no-lockfiles /repo

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: trivy
          smoke: --version

      - name: trivy fs
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/trivy
          fs --scanners vuln,secret --skip-dirs rendered /repo

  sopssecrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read k3s_version
        id: k3s
        run: echo "version=$(grep -oE 'k3s_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE 'v[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ops
          build-args: KUBECTL_VERSION=${{ steps.k3s.outputs.version }}
          smoke: sops --version

      - name: Every SOPS file is encrypted
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/ops
          .tools/check-sopssecrets-encrypted.sh

  ast-grep:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ast-grep
          smoke: ast-grep --version

      - name: ast-grep
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/ast-grep
          ast-grep scan --config .config/ast-grep/sgconfig.yml .

  jscpd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: jscpd
          smoke: jscpd --version

      - name: jscpd
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/jscpd jscpd --config .config/jscpd.json | tee jscpd-output.txt

      - name: Write duplication summary
        if: always()
        run: cat jscpd-output.txt >> "$GITHUB_STEP_SUMMARY"

  kube-linter:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: kube-linter
          smoke: version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: kube-linter
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/kube-linter
          lint --config .config/kube-linter.yaml --ignore-paths rendered/cilium.yaml
          --format sarif --output kube-linter.sarif rendered argocd

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: kube-linter.sarif

  checkov:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: checkov
          smoke: --version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: checkov
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/checkov
          --directory rendered --directory argocd --framework kubernetes
          --check CKV_K8S_16,CKV_K8S_18,CKV_K8S_19 --skip-path rendered/cilium.yaml
          --output sarif --output-file-path results --soft-fail

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results/results_sarif.sarif

  kubeconform:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build kubeconform image
        uses: ./.github/actions/tool-image
        with:
          target: kubeconform
          smoke: -v

      - name: Build shell image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: kubeconform
        run: >-
          mkdir -p .kubeconform-cache &&
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/kubeconform
          -strict -ignore-missing-schemas -summary -n 2 -cache .kubeconform-cache
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -skip ImageUpdater
          rendered argocd/root argocd/applications

      - name: Every image has a tag or digest
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-images-pinned.sh

  trivy-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: trivy
          smoke: --version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: trivy config
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/trivy
          config --misconfig-scanners kubernetes,terraform --skip-files rendered/cilium.yaml .

  tofu:
    runs-on: ubuntu-24.04
    env:
      TF_VAR_state_passphrase: validate-only-passphrase-never-used-for-real-state
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read opentofu_version
        id: tofu
        run: echo "version=$(grep -oE 'opentofu_version := "[0-9.]+"' justfile | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: tofu fmt
        env:
          TOFU_IMAGE: ghcr.io/opentofu/opentofu:${{ steps.tofu.outputs.version }}
        run: docker run --rm -v "$PWD":/repo -w /repo "$TOFU_IMAGE" fmt -check -recursive tofu

      - name: tofu validate
        env:
          TOFU_IMAGE: ghcr.io/opentofu/opentofu:${{ steps.tofu.outputs.version }}
        run: |
          for dir in tofu/*/; do
            docker run --rm -v "$PWD":/repo -w /repo -e TF_VAR_state_passphrase "$TOFU_IMAGE" -chdir="$dir" init -backend=false -input=false
            docker run --rm -v "$PWD":/repo -w /repo -e TF_VAR_state_passphrase "$TOFU_IMAGE" -chdir="$dir" validate
          done

  gate:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - actionlint
      - zizmor
      - yamllint
      - ansible-lint
      - shellcheck
      - hadolint
      - markdownlint
      - helm-lint
      - prose
      - docs-consistency
      - spelling
      - gitleaks
      - osv-scanner
      - trivy-fs
      - sopssecrets
      - ast-grep
      - jscpd
      - kube-linter
      - checkov
      - kubeconform
      - trivy-config
      - tofu
    steps:
      - name: Write summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| job | result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if echo "$NEEDS" | jq -e '[.[].result] | any(. != "success")' >/dev/null; then
            echo "at least one required job did not succeed" >&2
            exit 1
          fi
