name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint sh rhysd/actionlint:1.7.12
          -c "actionlint -color .github/workflows/*.yml"

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tool image
        run: docker build --target gitleaks -t hl-infra/gitleaks .tools/docker

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/gitleaks
          detect --source /repo --config /repo/.config/gitleaks.toml
          --gitleaks-ignore-path /repo/.config/gitleaksignore --redact
          --report-format sarif --report-path gitleaks.sarif -v

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: gitleaks.sarif

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build --target osv-scanner -t hl-infra/osv-scanner .tools/docker

      - name: osv-scanner
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/osv-scanner
          scan source --recursive --experimental-exclude rendered --allow-no-lockfiles /repo

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build --target trivy -t hl-infra/trivy .tools/docker

      - name: trivy fs
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/trivy
          fs --scanners vuln,secret --skip-dirs rendered /repo

  ast-grep:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build --target ast-grep -t hl-infra/ast-grep .tools/docker

      - name: ast-grep
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/ast-grep
          ast-grep scan --config .config/ast-grep/sgconfig.yml .

  jscpd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        run: docker build --target jscpd -t hl-infra/jscpd .tools/docker

      - name: jscpd
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/jscpd jscpd --config .config/jscpd.json | tee jscpd-output.txt

      - name: Write duplication summary
        if: always()
        run: cat jscpd-output.txt >> "$GITHUB_STEP_SUMMARY"

  kube-linter:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool images
        run: |
          docker build --target helm --build-arg HELM_VERSION="$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all.example.yml | grep -oE '[0-9.]+')" -t hl-infra/helm .tools/docker
          docker build --target kube-linter -t hl-infra/kube-linter .tools/docker

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: kube-linter
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/kube-linter
          lint --config .config/kube-linter.yaml --ignore-paths rendered/cilium.yaml
          --format sarif --output kube-linter.sarif rendered argocd

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: kube-linter.sarif

  checkov:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool images
        run: |
          docker build --target helm --build-arg HELM_VERSION="$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all.example.yml | grep -oE '[0-9.]+')" -t hl-infra/helm .tools/docker
          docker build --target checkov -t hl-infra/checkov .tools/docker

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: checkov
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/checkov
          --directory rendered --directory argocd --framework kubernetes
          --check CKV_K8S_16,CKV_K8S_18,CKV_K8S_19 --skip-path rendered/cilium.yaml
          --output sarif --output-file-path results --soft-fail

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: results/results_sarif.sarif

  trivy-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool images
        run: |
          docker build --target helm --build-arg HELM_VERSION="$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all.example.yml | grep -oE '[0-9.]+')" -t hl-infra/helm .tools/docker
          docker build --target trivy -t hl-infra/trivy .tools/docker

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: trivy config
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/trivy
          config --misconfig-scanners kubernetes --skip-dirs rendered/cilium.yaml .

  gate:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - actionlint
      - zizmor
      - gitleaks
      - osv-scanner
      - trivy-fs
      - ast-grep
      - jscpd
      - kube-linter
      - checkov
      - trivy-config
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "at least one required job failed" >&2
            exit 1
          fi
