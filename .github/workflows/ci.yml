name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ github.event_name != 'pull_request' }}
      ansible: ${{ steps.filter.outputs.ansible }}
      charts: ${{ steps.filter.outputs.charts }}
      tofu: ${{ steps.filter.outputs.tofu }}
      docs: ${{ steps.filter.outputs.docs }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect which areas changed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ansible:
              - ansible/**
              - .config/ansible-lint.yml
            charts:
              - argocd/**
              - ansible/**
              - .tools/**
              - .config/**
              - .trivyignore.yaml
              - justfile
            tofu:
              - tofu/**
              - .tools/tofu-*.sh
              - .config/conftest/**
              - justfile
            docs:
              - docs/**
              - "**/*.md"
              - .config/**
            tools:
              - .tools/**
              - .config/**

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint sh rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -c "actionlint -color .github/workflows/*.yml"

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: yamllint
          smoke: --version

      - name: yamllint
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/yamllint -c .config/yamllint.yml .

  ansible-lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.ansible == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ansible-lint
          smoke: --version

      - name: Restore the Galaxy collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ansible-collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}

      - name: ansible-lint
        run: >-
          mkdir -p .cache/ansible-collections &&
          docker run --rm -v "$PWD":/repo -w /repo -e ANSIBLE_COLLECTIONS_PATH=/tmp/collections
          -v "$PWD/.cache/ansible-collections":/tmp/collections
          --entrypoint sh hl-infra/ansible-lint
          -c "ansible-galaxy collection install -r ansible/requirements.yml -p /tmp/collections >/dev/null && ansible-lint -c .config/ansible-lint.yml"

  shellcheck:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.tools == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shellcheck
          smoke: --version

      - name: shellcheck
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/shellcheck .tools/*.sh

  hadolint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.tools == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: hadolint
          smoke: --version

      - name: hadolint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/hadolint
          --ignore DL3008 --ignore DL3018 .tools/docker/Dockerfile

  markdownlint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: markdownlint
          smoke: markdownlint-cli2 --version

      - name: markdownlint-cli2
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/markdownlint
          markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc
          README.md SECURITY.md SUPPORT.md CONTRIBUTING.md 'docs/**/*.md'

  helm-lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: helm lint
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/lint-charts.sh

  prose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: No em dash, en dash or Unicode arrow
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-prose.sh

  placeholders:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: No placeholder value left in the codebase
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          --entrypoint bash hl-infra/shell .tools/lint-placeholders.sh

  pod-security:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Every namespace created by an Application enforces Pod Security
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-namespace-pod-security.sh

  secret-age:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Warn about secrets past their rotation deadline
        if: github.event_name != 'schedule'
        run: docker run --rm -v "$PWD":/repo -w /repo -e GITHUB_ACTIONS --entrypoint bash hl-infra/shell .tools/check-secret-age.sh

      - name: Fail on secrets past their rotation deadline
        if: github.event_name == 'schedule'
        run: docker run --rm -v "$PWD":/repo -w /repo -e GITHUB_ACTIONS --entrypoint bash hl-infra/shell .tools/check-secret-age.sh --fail-on-stale

      - name: Warn when the periodic security review is overdue
        if: github.event_name != 'schedule'
        run: docker run --rm -v "$PWD":/repo -w /repo -e GITHUB_ACTIONS --entrypoint bash hl-infra/shell .tools/check-security-review.sh

      - name: Fail when the periodic security review is overdue
        if: github.event_name == 'schedule'
        run: docker run --rm -v "$PWD":/repo -w /repo -e GITHUB_ACTIONS --entrypoint bash hl-infra/shell .tools/check-security-review.sh --fail-on-stale

  docs-consistency:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Pages reviewed after their sources changed
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          --entrypoint bash hl-infra/shell .tools/check-doc-drift.sh

      - name: Every role is documented
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-roles-documented.sh

  spelling:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: cspell
          smoke: --version

      - name: cspell
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/cspell --config .config/cspell.yaml --no-progress

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: gitleaks
          smoke: version

      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/gitleaks
          detect --source /repo --config /repo/.config/gitleaks.toml
          --gitleaks-ignore-path /repo/.config/gitleaksignore --redact
          --report-format sarif --report-path gitleaks.sarif -v

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: gitleaks.sarif

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: osv-scanner
          smoke: --version

      - name: osv-scanner
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/osv-scanner
          scan source --recursive --experimental-exclude .build --experimental-exclude .cache --allow-no-lockfiles /repo

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: trivy
          smoke: --version

      - name: Restore the trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: trivy fs
        run: >-
          mkdir -p .cache/trivy &&
          docker run --rm -v "$PWD":/repo -w /repo -v "$PWD/.cache/trivy":/root/.cache/trivy hl-infra/trivy
          fs --scanners vuln,secret --skip-dirs .build --skip-dirs .cache /repo

  sopssecrets:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read k3s_version
        id: k3s
        run: echo "version=$(grep -oE 'k3s_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE 'v[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ops
          build-args: KUBECTL_VERSION=${{ steps.k3s.outputs.version }}
          smoke: sops --version

      - name: Every SOPS file is encrypted
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/ops
          .tools/check-sopssecrets-encrypted.sh

  ast-grep:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ast-grep
          smoke: ast-grep --version

      - name: ast-grep
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/ast-grep
          ast-grep scan --config .config/ast-grep/sgconfig.yml .

      - name: Build shell image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: No narrative comment in a Dockerfile
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          --entrypoint bash hl-infra/shell .tools/check-dockerfile-comments.sh

  jscpd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: jscpd
          smoke: jscpd --version

      - name: jscpd
        run: docker run --rm -v "$PWD":/repo -w /repo hl-infra/jscpd jscpd --config .config/jscpd.json | tee jscpd-output.txt

      - name: Write duplication summary
        if: always()
        run: cat jscpd-output.txt >> "$GITHUB_STEP_SUMMARY"

  kube-linter:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: kube-linter
          smoke: version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: kube-linter
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/kube-linter
          lint --config .config/kube-linter.yaml --ignore-paths .build/rendered/cilium.yaml
          --format sarif --output kube-linter.sarif .build/rendered argocd

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: kube-linter.sarif

  checkov:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: checkov
          smoke: --version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: checkov
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/checkov
          --directory .build/rendered --directory argocd --framework kubernetes
          --check CKV_K8S_16,CKV_K8S_18,CKV_K8S_19 --skip-path .build/rendered/cilium.yaml
          --output sarif --output-file-path results --soft-fail

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results/results_sarif.sarif

  kubeconform:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Restore the kubeconform schema cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kubeconform
          key: kubeconform-${{ hashFiles('ansible/group_vars/all/versions.yml', 'argocd/**/Chart.yaml') }}
          restore-keys: kubeconform-

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build kubeconform image
        uses: ./.github/actions/tool-image
        with:
          target: kubeconform
          smoke: -v

      - name: Build shell image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: kubeconform
        run: >-
          mkdir -p .cache/kubeconform &&
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/kubeconform
          -strict -ignore-missing-schemas -summary -n 2 -cache .cache/kubeconform
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          .build/rendered argocd/root argocd/applications

      - name: Every image has a tag or digest
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/check-images-pinned.sh

  trivy-config:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: trivy
          smoke: --version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: Restore the trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: trivy config
        run: >-
          mkdir -p .cache/trivy &&
          docker run --rm -v "$PWD":/repo -w /repo -v "$PWD/.cache/trivy":/root/.cache/trivy hl-infra/trivy
          config --misconfig-scanners kubernetes,terraform --skip-files .build/rendered/cilium.yaml .

  tofu:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.tofu == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned OpenTofu image
        id: tofu
        run: echo "image=$(grep -oE 'tofu_image := "[^"]+"' justfile | grep -oE 'ghcr.io[^"]+')" >> "$GITHUB_OUTPUT"

      - name: tofu fmt
        env:
          TOFU_IMAGE: ${{ steps.tofu.outputs.image }}
        run: docker run --rm -v "$PWD":/repo -w /repo "$TOFU_IMAGE" fmt -check -recursive tofu

      - name: Restore the provider mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tofu/mirror
          key: tofu-mirror-${{ hashFiles('tofu/*/versions.tf', '.tools/tofu-mirror.sh') }}

      - name: Mirror the providers the registry cannot verify
        run: .tools/tofu-mirror.sh

      - name: tofu validate
        env:
          TOFU_IMAGE: ${{ steps.tofu.outputs.image }}
        run: .tools/tofu-validate.sh

      - name: Build conftest image
        uses: ./.github/actions/tool-image
        with:
          target: conftest
          smoke: --version

      - name: conftest over the OpenTofu modules
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/conftest
          test --no-color --parser hcl2 --policy .config/conftest/tofu tofu/*/*.tf

  kubescape:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: kubescape
          smoke: version

      - name: Render charts
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: kubescape NSA and MITRE frameworks
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo hl-infra/kubescape
          scan framework nsa,mitre .build/rendered argocd
          --compliance-threshold 78 --logger warning

  trivy-images:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Build shell image
        uses: ./.github/actions/tool-image
        with:
          target: shell
          smoke: bash --version

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: trivy
          smoke: --version

      - name: Render charts
        run: |
          mkdir -p .build
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: No fixable critical vulnerability in a deployed image, and an SBOM for each
        run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/shell .tools/list-images.sh > .build/images.txt && .tools/trivy-images.sh .build/images.txt .build/sbom

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: .build/sbom/
          if-no-files-found: ignore
          retention-days: 30

  commitlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: commitlint
          smoke: --version

      - name: Commit messages follow the convention
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .tools/lint-commits.sh "$BEFORE" "$AFTER"

  domain-expiry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read k3s_version
        id: k3s
        run: echo "version=$(grep -oE 'k3s_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE 'v[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build tool image
        uses: ./.github/actions/tool-image
        with:
          target: ops
          build-args: KUBECTL_VERSION=${{ steps.k3s.outputs.version }}
          smoke: sops --version

      - name: Warn when the domain is close to expiring
        if: github.event_name != 'schedule'
        run: docker run --rm -v "$PWD":/repo -w /repo -e GITHUB_ACTIONS --entrypoint bash hl-infra/ops .tools/check-domain-expiry.sh

      - name: Fail when the domain is about to expire
        if: github.event_name == 'schedule'
        run: docker run --rm -v "$PWD":/repo -w /repo -e GITHUB_ACTIONS --entrypoint bash hl-infra/ops .tools/check-domain-expiry.sh --fail-on-near

  manifest-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: Read helm_version
        id: helm
        run: echo "version=$(grep -oE 'helm_version:\s*v[0-9.]+' ansible/group_vars/all/versions.yml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Build helm image
        uses: ./.github/actions/tool-image
        with:
          target: helm
          build-args: HELM_VERSION=${{ steps.helm.outputs.version }}
          smoke: version

      - name: Render base and head
        run: |
          docker run --rm -v "$PWD/.base":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash hl-infra/helm .tools/render-charts.sh

      - name: Diff the rendered manifests
        run: bash .tools/render-diff.sh .base .

  gate:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - actionlint
      - zizmor
      - yamllint
      - ansible-lint
      - shellcheck
      - hadolint
      - markdownlint
      - helm-lint
      - prose
      - placeholders
      - pod-security
      - docs-consistency
      - spelling
      - gitleaks
      - osv-scanner
      - trivy-fs
      - sopssecrets
      - ast-grep
      - jscpd
      - kube-linter
      - checkov
      - kubeconform
      - trivy-config
      - tofu
      - kubescape
      - trivy-images
      - commitlint
      - domain-expiry
    steps:
      - name: Write summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| job | result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if echo "$NEEDS" | jq -e '[.[].result] | any(. != "success" and . != "skipped")' >/dev/null; then
            echo "at least one required job failed or was cancelled" >&2
            exit 1
          fi
