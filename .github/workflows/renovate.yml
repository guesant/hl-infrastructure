name: renovate

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-24.04
    environment: renovate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@c314dda4a9a93b08239ec978f2043b9a433b9ac4 # v46.3.0
        with:
          configurationFile: .config/renovate.json
          token: "${{ secrets.RENOVATE_TOKEN }}"
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: guesant/hl-infrastructure
          RENOVATE_ALLOWED_COMMANDS: '["^curl -fsSL .* -o "]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
        timeout-minutes: 30
