---
- name: Assert the Argo CD Image Updater chart version is declared and well formed
  ansible.builtin.assert:
    that:
      - argocd_image_updater_chart_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "argocd_image_updater_chart_version must look like 1.3.1, got {{ argocd_image_updater_chart_version | default('undefined') }}"

- name: Install Argo CD Image Updater once the cluster exists
  when: k3s_cluster_gate | default(true)
  block:
    - name: Add the Argo Helm repository
      ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
      register: argocd_image_updater_repo_add
      changed_when: "'already exists' not in argocd_image_updater_repo_add.stderr"
      failed_when: argocd_image_updater_repo_add.rc != 0 and 'already exists' not in argocd_image_updater_repo_add.stderr
      check_mode: false

    - name: Update the Argo Helm repository index
      ansible.builtin.command: helm repo update argo
      changed_when: false
      check_mode: false

    - name: Render and apply the Argo CD Image Updater chart
      ansible.builtin.shell: >
        set -o pipefail &&
        helm template argocd-image-updater argo/argocd-image-updater
        --version {{ argocd_image_updater_chart_version }}
        --namespace argocd
        --include-crds
        | k3s kubectl apply --server-side --force-conflicts {{ '--dry-run=server' if ansible_check_mode else '' }} -n argocd -f -
      args:
        executable: /bin/bash
      register: argocd_image_updater_apply
      changed_when: "'unchanged' not in argocd_image_updater_apply.stdout"
      failed_when: false
      check_mode: false

    - name: Recover from immutable-field conflicts and retry, if needed
      ansible.builtin.include_role:
        name: recreate_immutable_conflicts
      vars:
        recreate_immutable_conflicts_apply: "{{ argocd_image_updater_apply }}"
        recreate_immutable_conflicts_namespace: argocd
      when: argocd_image_updater_apply.rc != 0 and not ansible_check_mode

    - name: Abort if the chart still failed to apply
      ansible.builtin.assert:
        that:
          - argocd_image_updater_apply.rc == 0 or ansible_check_mode or (recreate_immutable_conflicts_retry.rc | default(1)) == 0
        fail_msg: "the Argo CD Image Updater chart failed to apply: {{ argocd_image_updater_apply.stderr }}"

    - name: Wait for Argo CD Image Updater to roll out
      ansible.builtin.command: k3s kubectl -n argocd rollout status deployment/argocd-image-updater-controller --timeout=180s
      changed_when: false
      check_mode: false
