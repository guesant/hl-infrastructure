---
- name: Assert the operator public key is declared and is not the placeholder
  ansible.builtin.assert:
    that:
      - ssh_root_authorized_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) [A-Za-z0-9+/=]{40,}')
      - "'changeme' not in ssh_root_authorized_key"
    fail_msg: >-
      ssh_root_authorized_key must be a real public key (ssh-ed25519 AAAA... comment),
      not the placeholder from secrets.example.yml; password login is disabled by this role,
      so a bad key here locks you out

- name: Determine the ansible_user home directory
  ansible.builtin.set_fact:
    ssh_hardening_authorized_keys_path: "{{ '/root/.ssh/authorized_keys' if ansible_user == 'root' else '/home/' + ansible_user + '/.ssh/authorized_keys' }}"

- name: Check whether the ansible_user has an authorized_keys file
  ansible.builtin.stat:
    path: "{{ ssh_hardening_authorized_keys_path }}"
  register: ssh_hardening_authorized_keys

- name: Abort if no public key is present for the ansible_user
  ansible.builtin.assert:
    that:
      - ssh_hardening_authorized_keys.stat.exists
      - ssh_hardening_authorized_keys.stat.size > 0
    fail_msg: >-
      abortando: nenhuma chave publica encontrada em {{ ssh_hardening_authorized_keys_path }},
      desligar password auth agora causaria lockout
    success_msg: "chave publica encontrada em {{ ssh_hardening_authorized_keys_path }}, prosseguindo"

- name: Ensure the operator public key is authorized for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ ssh_root_authorized_key }}"
    state: present

- name: Write the sshd hardening drop-in
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Validate sshd configuration syntax before reload
  ansible.builtin.command: sshd -t
  changed_when: false
