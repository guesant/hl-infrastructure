---
- name: Assert at least one authorized key is declared
  ansible.builtin.assert:
    that:
      - ssh_hardening_authorized_keys | length > 0
    fail_msg: "ssh_hardening_authorized_keys is empty; declaring it empty would lock every operator out"

- name: Determine the ansible_user home directory
  ansible.builtin.set_fact:
    ssh_hardening_authorized_keys_path: "{{ '/root/.ssh/authorized_keys' if ansible_user == 'root' else '/home/' + ansible_user + '/.ssh/authorized_keys' }}"

- name: Determine the operator private key path
  ansible.builtin.set_fact:
    ssh_hardening_operator_key_path: "{{ ansible_ssh_private_key_file | regex_replace('^~', lookup('env', 'HOME')) }}"

- name: Read the identity file the inventory points at
  ansible.builtin.slurp:
    path: "{{ ssh_hardening_operator_key_path }}"
  register: ssh_hardening_operator_identity
  delegate_to: localhost
  become: false
  no_log: true

- name: Work out whether the identity file is already a public key
  ansible.builtin.set_fact:
    ssh_hardening_identity_is_public: "{{ (ssh_hardening_operator_identity.content | b64decode) is match('^(ssh-|ecdsa-|sk-)') }}"

- name: Derive the public key from the private identity
  when: not ssh_hardening_identity_is_public
  block:
    - name: Create a locked-down temporary copy of the operator private key
      ansible.builtin.tempfile:
        state: file
        suffix: ssh-hardening
      register: ssh_hardening_operator_key_tmp
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Copy the private key into the temporary file with strict permissions
      ansible.builtin.copy:
        src: "{{ ssh_hardening_operator_key_path }}"
        dest: "{{ ssh_hardening_operator_key_tmp.path }}"
        mode: "0600"
        remote_src: true
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true

    - name: Extract the public key that authenticates this connection
      ansible.builtin.command: "ssh-keygen -y -f {{ ssh_hardening_operator_key_tmp.path }}"
      register: ssh_hardening_operator_pubkey_derived
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: false
  always:
    - name: Remove the temporary copy of the private key
      ansible.builtin.file:
        path: "{{ ssh_hardening_operator_key_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      when: ssh_hardening_operator_key_tmp.path is defined

- name: Keep the public key body that authenticates this connection
  ansible.builtin.set_fact:
    ssh_hardening_operator_pubkey_body: >-
      {{ ((ssh_hardening_operator_identity.content | b64decode) if ssh_hardening_identity_is_public
          else ssh_hardening_operator_pubkey_derived.stdout)
         | trim | regex_replace('^(\S+ \S+).*$', '\1') }}

- name: Work out the declared key bodies, ignoring comments
  ansible.builtin.set_fact:
    ssh_hardening_declared_key_bodies: >-
      {{ ssh_hardening_authorized_keys
         | map('trim')
         | map('regex_replace', '^(\S+ \S+).*$', '\1')
         | list }}

- name: Assert the key used for this connection stays declared
  ansible.builtin.assert:
    that:
      - ssh_hardening_operator_pubkey_body in ssh_hardening_declared_key_bodies
    fail_msg: >-
      abortando: a chave usada nesta conexão não está em ssh_hardening_authorized_keys;
      aplicar isso trancaria o operador para fora

- name: Check whether the ansible_user has an authorized_keys file
  ansible.builtin.stat:
    path: "{{ ssh_hardening_authorized_keys_path }}"
  register: ssh_hardening_authorized_keys_file

- name: Read the current authorized_keys content
  ansible.builtin.slurp:
    path: "{{ ssh_hardening_authorized_keys_path }}"
  register: ssh_hardening_authorized_keys_slurp
  when: ssh_hardening_authorized_keys_file.stat.exists

- name: Work out which keys on the node are undeclared
  ansible.builtin.set_fact:
    ssh_hardening_undeclared_keys: "{{ ssh_hardening_current_key_bodies | difference(ssh_hardening_declared_key_bodies) }}"
  vars:
    ssh_hardening_current_key_bodies: >-
      {{ (ssh_hardening_authorized_keys_slurp.content | default('') | b64decode).splitlines()
         | map('trim')
         | reject('equalto', '')
         | reject('match', '^#')
         | map('regex_replace', '^(\S+ \S+).*$', '\1')
         | list
         if ssh_hardening_authorized_keys_file.stat.exists else [] }}

- name: Refuse to remove more keys than the safety cap allows
  ansible.builtin.assert:
    that:
      - ssh_hardening_undeclared_keys | length <= ssh_hardening_max_key_removals
    fail_msg: >-
      {{ ssh_hardening_undeclared_keys | length }} chave(s) não declaradas seriam removidas,
      acima do teto de {{ ssh_hardening_max_key_removals }}: declare-as em ssh_hardening_authorized_keys
      ou aumente ssh_hardening_max_key_removals por uma execução, depois de revisar a lista

- name: Write the declared authorized_keys, replacing anything undeclared
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_authorized_keys_path }}"
    content: "{{ (ssh_hardening_authorized_keys | map('trim') | list | join('\n')) + '\n' }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    backup: true

- name: Write the sshd hardening drop-in
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: >-
      /bin/sh -c 'printf "Include %s\nInclude /etc/ssh/sshd_config\n" > /run/sshd-validate.conf
      && /usr/sbin/sshd -t -f /run/sshd-validate.conf; status=$?;
      rm -f /run/sshd-validate.conf; exit $status'
  notify: Reload sshd

- name: Validate sshd configuration syntax before reload
  ansible.builtin.command: sshd -t
  changed_when: false
