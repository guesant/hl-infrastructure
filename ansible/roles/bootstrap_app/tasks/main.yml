---
- name: Copy the ArgoCD root AppProjects and root Application
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../argocd/root/"
    dest: /tmp/argocd-root/
    mode: "0644"

- name: Apply the ArgoCD root AppProjects and root Application
  ansible.builtin.command: k3s kubectl apply --server-side --force-conflicts -n argocd -f /tmp/argocd-root/
  register: argocd_root_apply
  changed_when: "'unchanged' not in argocd_root_apply.stdout"
