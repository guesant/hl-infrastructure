---
- name: Ensure age is installed
  ansible.builtin.apt:
    name: age
    state: present

- name: Deliver the sops-secrets-operator decryption key once the cluster exists
  when: k3s_cluster_gate | default(true)
  block:
    - name: Create the sops namespace
      ansible.builtin.command: k3s kubectl create namespace sops
      register: sops_age_key_namespace
      changed_when: sops_age_key_namespace.rc == 0
      failed_when: sops_age_key_namespace.rc != 0 and 'AlreadyExists' not in sops_age_key_namespace.stderr

    - name: Check whether the age key secret already exists
      ansible.builtin.command: k3s kubectl -n sops get secret sops-age-key-file
      register: sops_age_key_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Generate and deliver a new age keypair, never left on disk
      when: sops_age_key_check.rc != 0
      block:
        - name: Create a private temporary directory for the keypair
          ansible.builtin.tempfile:
            state: directory
            suffix: sops-age-key
          register: sops_age_key_tempdir

        - name: Generate a new age keypair on the node
          ansible.builtin.command: age-keygen -o {{ sops_age_key_tempdir.path }}/keys.txt
          changed_when: true

        - name: Create the age key secret from the generated keypair
          ansible.builtin.command: >-
            k3s kubectl -n sops create secret generic sops-age-key-file
            --from-file=keys.txt={{ sops_age_key_tempdir.path }}/keys.txt
          changed_when: true
      always:
        - name: Remove the temporary directory holding the keypair
          ansible.builtin.file:
            path: "{{ sops_age_key_tempdir.path }}"
            state: absent
          when: sops_age_key_tempdir.path is defined

    - name: Read the current public key from the cluster secret, without writing the private half to disk
      ansible.builtin.shell: >-
        set -o pipefail &&
        k3s kubectl -n sops get secret sops-age-key-file -o jsonpath='{.data.keys\.txt}'
        | base64 -d | age-keygen -y
      args:
        executable: /bin/bash
      register: sops_age_key_public
      changed_when: false
      check_mode: false
      when: sops_age_key_check.rc == 0 or not ansible_check_mode

    - name: Print the public key
      ansible.builtin.debug:
        msg: "Add this recipient to .sops.yaml: {{ sops_age_key_public.stdout }}"
      when: sops_age_key_check.rc == 0 or not ansible_check_mode
