---
- name: Ensure age is installed
  ansible.builtin.apt:
    name: age
    state: present

- name: Deliver the sops-secrets-operator decryption key once the cluster exists
  when: k3s_cluster_gate | default(true)
  block:
    - name: Create the sops namespace
      ansible.builtin.command: k3s kubectl create namespace sops
      register: sops_age_key_namespace
      changed_when: sops_age_key_namespace.rc == 0
      failed_when: sops_age_key_namespace.rc != 0 and 'AlreadyExists' not in sops_age_key_namespace.stderr

    - name: Check whether the age key secret already exists
      ansible.builtin.command: k3s kubectl -n sops get secret sops-age-key-file
      register: sops_age_key_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Generate a new age keypair on the node
      ansible.builtin.command: age-keygen -o /root/sops-age-key.txt
      when: sops_age_key_check.rc != 0
      changed_when: true

    - name: Restrict the keypair file to root
      ansible.builtin.file:
        path: /root/sops-age-key.txt
        mode: "0600"
      when: sops_age_key_check.rc != 0

    - name: Create the age key secret from the generated keypair
      ansible.builtin.command: >-
        k3s kubectl -n sops create secret generic sops-age-key-file
        --from-file=keys.txt=/root/sops-age-key.txt
      when: sops_age_key_check.rc != 0
      changed_when: true

    - name: Read the public key so it can be added to .sops.yaml
      ansible.builtin.command: age-keygen -y /root/sops-age-key.txt
      register: sops_age_key_public
      when: sops_age_key_check.rc != 0
      changed_when: false

    - name: Print the public key
      ansible.builtin.debug:
        msg: "Add this recipient to .sops.yaml: {{ sops_age_key_public.stdout }}"
      when: sops_age_key_check.rc != 0
