---
- name: Assert the ArgoCD variables are declared and well formed
  ansible.builtin.assert:
    that:
      - argocd_chart_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - argocd_github_webhook_secret | length >= 20
      - "'changeme' not in argocd_github_webhook_secret"
    fail_msg: >-
      argocd_chart_version ({{ argocd_chart_version | default('undefined') }}) must be like 10.9.0
      and argocd_github_webhook_secret must be a generated secret of at least 20 characters,
      not the placeholder from secrets.example.yml

- name: Install ArgoCD once the cluster exists
  when: k3s_cluster_gate | default(true)
  block:
    - name: Create the argocd namespace
      ansible.builtin.command: k3s kubectl create namespace argocd
      register: argocd_namespace
      changed_when: argocd_namespace.rc == 0
      failed_when: argocd_namespace.rc != 0 and 'AlreadyExists' not in argocd_namespace.stderr

    - name: Label the argocd namespace with its Pod Security levels
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - label
          - namespace
          - argocd
          - --overwrite
          - pod-security.kubernetes.io/enforce=restricted
          - pod-security.kubernetes.io/warn=restricted
          - pod-security.kubernetes.io/audit=restricted
      register: argocd_namespace_labels
      changed_when: "'not labeled' not in argocd_namespace_labels.stdout"
      when: not ansible_check_mode

    - name: Install the declared ArgoCD chart values
      ansible.builtin.copy:
        src: values.yaml
        dest: /etc/rancher/argocd-values.yaml
        owner: root
        group: root
        mode: "0600"
      check_mode: false

    - name: Read the hash of the ArgoCD inputs applied by the last run
      ansible.builtin.slurp:
        path: /etc/rancher/argocd-applied.sha256
      register: argocd_applied_hash
      failed_when: false

    - name: Compute the hash of the ArgoCD inputs
      ansible.builtin.set_fact:
        argocd_inputs_hash: "{{ (argocd_chart_version ~ lookup('ansible.builtin.file', 'values.yaml')) | hash('sha256') }}"

    - name: Decide whether the ArgoCD chart must be diffed against the cluster
      ansible.builtin.set_fact:
        argocd_reconcile: >-
          {{ chart_reconcile | default(false) | bool
             or argocd_applied_hash.content is not defined
             or (argocd_applied_hash.content | b64decode | trim) != argocd_inputs_hash }}

    - name: Report that the ArgoCD inputs did not change since the last apply
      ansible.builtin.debug:
        msg: >-
          argo-cd {{ argocd_chart_version }} and its values match the hash applied by the last run;
          pass -e chart_reconcile=true to diff against the cluster anyway
      when: not argocd_reconcile

    - name: Add the Argo Helm repository
      ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
      register: argocd_repo_add
      changed_when: "'already exists' not in argocd_repo_add.stdout"
      check_mode: false
      when: argocd_reconcile

    - name: Update the Argo Helm repository index
      ansible.builtin.command: helm repo update argo
      changed_when: false
      check_mode: false
      when: argocd_reconcile

    - name: Probe whether the ArgoCD chart differs from the cluster
      ansible.builtin.shell: >
        set -o pipefail &&
        helm template argocd argo/argo-cd
        --version {{ argocd_chart_version }}
        --namespace argocd
        --values /etc/rancher/argocd-values.yaml
        --include-crds
        | k3s kubectl diff --server-side -n argocd -f -
      args:
        executable: /bin/bash
      register: argocd_diff
      changed_when: false
      failed_when: argocd_diff.rc not in [0, 1]
      check_mode: false
      when: argocd_reconcile

    - name: Render and apply the ArgoCD chart
      ansible.builtin.shell: >
        set -o pipefail &&
        helm template argocd argo/argo-cd
        --version {{ argocd_chart_version }}
        --namespace argocd
        --values /etc/rancher/argocd-values.yaml
        --include-crds
        | k3s kubectl apply --server-side --force-conflicts -n argocd -f -
      args:
        executable: /bin/bash
      register: argocd_apply
      when: argocd_reconcile and argocd_diff.rc == 1 and not ansible_check_mode
      changed_when: true
      failed_when: false

    - name: Recover from immutable-field conflicts and retry, if needed
      ansible.builtin.include_role:
        name: recreate_immutable_conflicts
      vars:
        recreate_immutable_conflicts_apply: "{{ argocd_apply }}"
        recreate_immutable_conflicts_namespace: argocd
      when: argocd_reconcile and argocd_diff.rc == 1 and not ansible_check_mode and argocd_apply.rc != 0

    - name: Abort if the chart still failed to apply
      ansible.builtin.assert:
        that:
          - >-
            not argocd_reconcile or argocd_diff.rc == 0 or ansible_check_mode
            or argocd_apply.rc == 0 or (recreate_immutable_conflicts_retry.rc | default(1)) == 0
        fail_msg: "the ArgoCD chart failed to apply: {{ argocd_apply.stderr | default('') }}"

    - name: Record the hash of the ArgoCD inputs now known to match the cluster
      ansible.builtin.copy:
        content: "{{ argocd_inputs_hash }}\n"
        dest: /etc/rancher/argocd-applied.sha256
        owner: root
        group: root
        mode: "0644"
      when: >-
        argocd_reconcile and (argocd_diff.rc == 0 or (argocd_apply.rc | default(1)) == 0
        or (recreate_immutable_conflicts_retry.rc | default(1)) == 0)

    - name: Wait for the ArgoCD server to roll out
      ansible.builtin.command: k3s kubectl -n argocd rollout status deployment/argocd-server --timeout=180s
      changed_when: false
      check_mode: false

    - name: Wait for the ArgoCD repo server to roll out
      ansible.builtin.command: k3s kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=180s
      changed_when: false
      check_mode: false

    - name: Wait for the ArgoCD application controller to roll out
      ansible.builtin.command: k3s kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=180s
      changed_when: false
      check_mode: false

    - name: Check whether the GitHub webhook secret is already set
      ansible.builtin.command: >-
        k3s kubectl -n argocd get secret argocd-secret
        -o jsonpath={.data.webhook\.github\.secret}
      register: argocd_webhook_secret_check
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Patch the GitHub webhook secret into argocd-secret
      ansible.builtin.command: >-
        k3s kubectl -n argocd patch secret argocd-secret --type merge
        -p '{"stringData":{"webhook.github.secret":"{{ argocd_github_webhook_secret }}"}}'
      when: argocd_webhook_secret_check.stdout != (argocd_github_webhook_secret | b64encode)
      changed_when: true
      no_log: true
