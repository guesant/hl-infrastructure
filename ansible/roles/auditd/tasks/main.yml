---
- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: auditd_install

- name: Configure the hardening audit rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules
  when: not (ansible_check_mode and auditd_install.changed)

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  when: not (ansible_check_mode and auditd_install.changed)
