---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether any NFS filesystem is mounted
  ansible.builtin.command: findmnt -rn -t nfs,nfs4
  register: os_prerequisites_nfs_mounts
  changed_when: false
  failed_when: os_prerequisites_nfs_mounts.rc not in [0, 1]
  check_mode: false

- name: Stop and mask rpcbind, which nothing on this node uses
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - rpcbind.socket
    - rpcbind.service
  when: os_prerequisites_nfs_mounts.stdout | length == 0

- name: List the unit files present on the node # noqa: command-instead-of-module
  ansible.builtin.command: systemctl list-unit-files --no-legend --no-pager
  register: os_prerequisites_unit_files
  changed_when: false
  check_mode: false

- name: Disable desktop and peripheral services nothing on this node uses
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ os_prerequisites_disabled_units }}"
  when: (item + ' ') in os_prerequisites_unit_files.stdout

- name: Read the Wi-Fi radio's rfkill state
  ansible.builtin.command: rfkill list wifi
  register: os_prerequisites_wifi_rfkill
  changed_when: false
  failed_when: false
  check_mode: false

- name: Block the Wi-Fi radio, since the node only depends on the wired link
  ansible.builtin.command: rfkill block wifi
  when: >-
    os_prerequisites_wifi_rfkill.rc == 0
    and 'Soft blocked: yes' not in os_prerequisites_wifi_rfkill.stdout
  changed_when: true

- name: Create the tmp.mount drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount /tmp without exec, suid or device files
  ansible.builtin.copy:
    dest: /etc/systemd/system/tmp.mount.d/noexec.conf
    content: |
      [Mount]
      Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%,nr_inodes=1m
    owner: root
    group: root
    mode: "0644"
  register: os_prerequisites_tmp_noexec

- name: Apply noexec to the running /tmp # noqa: no-handler command-instead-of-module
  ansible.builtin.command: mount -o remount,noexec,nosuid,nodev /tmp
  when: os_prerequisites_tmp_noexec.changed and not ansible_check_mode
  changed_when: true

- name: Install smartmontools to watch the SSD health
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Point smartd at the SSD behind its USB bridge
  ansible.builtin.copy:
    dest: /etc/smartd.conf
    content: |
      {{ os_prerequisites_smart_device }} -d {{ os_prerequisites_smart_device_type }} -a -n standby,q -W 4,60,70
    owner: root
    group: root
    mode: "0644"
  register: os_prerequisites_smartd_config

- name: Ensure smartd is enabled and running
  ansible.builtin.systemd_service:
    name: smartmontools
    enabled: true
    state: "{{ 'restarted' if os_prerequisites_smartd_config.changed else 'started' }}"
  when: not ansible_check_mode

- name: List the packages marked as manually installed
  ansible.builtin.command: apt-mark showmanual
  register: os_prerequisites_manual_packages
  changed_when: false
  check_mode: false

- name: Report packages installed by hand outside the recorded baseline
  ansible.builtin.debug:
    msg: >-
      packages marked manual that are not in files/apt-manual-baseline.txt:
      {{ os_prerequisites_manual_drift | join(', ') if os_prerequisites_manual_drift else 'none' }}
  vars:
    os_prerequisites_manual_drift: >-
      {{ os_prerequisites_manual_packages.stdout_lines
         | difference(lookup('ansible.builtin.file', 'apt-manual-baseline.txt').splitlines()
                      + os_prerequisites_expected_manual_packages) }}

- name: Find the active kernel cmdline file
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /boot/firmware/cmdline.txt
    - /boot/cmdline.txt
  register: os_prerequisites_cmdline_candidates

- name: Select the kernel cmdline file
  ansible.builtin.set_fact:
    os_prerequisites_cmdline_file: >-
      {{ os_prerequisites_cmdline_candidates.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}

- name: Enable the memory cgroup controller for containerd
  ansible.builtin.replace:
    path: "{{ os_prerequisites_cmdline_file }}"
    regexp: '^(?!.*cgroup_memory=1)(.*)$'
    replace: '\1 cgroup_memory=1 cgroup_enable=memory'
  register: os_prerequisites_cmdline_update
  when: os_prerequisites_cmdline_file | length > 0

- name: Reboot if the cgroup controller was just enabled # noqa: no-handler
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: os_prerequisites_cmdline_update.changed | default(false)
