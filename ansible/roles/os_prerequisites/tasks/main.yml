---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true

- name: Check whether any NFS filesystem is mounted
  ansible.builtin.command: findmnt -rn -t nfs,nfs4
  register: os_prerequisites_nfs_mounts
  changed_when: false
  failed_when: os_prerequisites_nfs_mounts.rc not in [0, 1]
  check_mode: false

- name: Stop and mask rpcbind, which nothing on this node uses
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - rpcbind.socket
    - rpcbind.service
  when: os_prerequisites_nfs_mounts.stdout | length == 0

- name: Find the active kernel cmdline file
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /boot/firmware/cmdline.txt
    - /boot/cmdline.txt
  register: os_prerequisites_cmdline_candidates

- name: Select the kernel cmdline file
  ansible.builtin.set_fact:
    os_prerequisites_cmdline_file: >-
      {{ os_prerequisites_cmdline_candidates.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}

- name: Enable the memory cgroup controller for containerd
  ansible.builtin.replace:
    path: "{{ os_prerequisites_cmdline_file }}"
    regexp: '^(?!.*cgroup_memory=1)(.*)$'
    replace: '\1 cgroup_memory=1 cgroup_enable=memory'
  register: os_prerequisites_cmdline_update
  when: os_prerequisites_cmdline_file | length > 0

- name: Reboot if the cgroup controller was just enabled # noqa: no-handler
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: os_prerequisites_cmdline_update.changed | default(false)
