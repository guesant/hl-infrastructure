---
- name: Assert the Sealed Secrets chart version is declared and well formed
  ansible.builtin.assert:
    that:
      - sealed_secrets_chart_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "sealed_secrets_chart_version must look like 2.20.0, got {{ sealed_secrets_chart_version | default('undefined') }}"

- name: Install Sealed Secrets once the cluster exists
  when: k3s_cluster_gate | default(true)
  block:
    - name: Add the Sealed Secrets Helm repository
      ansible.builtin.command: helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
      register: sealed_secrets_repo_add
      changed_when: "'already exists' not in sealed_secrets_repo_add.stderr"
      failed_when: sealed_secrets_repo_add.rc != 0 and 'already exists' not in sealed_secrets_repo_add.stderr
      check_mode: false

    - name: Update the Sealed Secrets Helm repository index
      ansible.builtin.command: helm repo update sealed-secrets
      changed_when: false
      check_mode: false

    - name: Render and apply the Sealed Secrets chart
      ansible.builtin.shell: >
        set -o pipefail &&
        helm template sealed-secrets-controller sealed-secrets/sealed-secrets
        --version {{ sealed_secrets_chart_version }}
        --namespace kube-system
        --include-crds
        | k3s kubectl apply --server-side --force-conflicts {{ '--dry-run=server' if ansible_check_mode else '' }} -f -
      args:
        executable: /bin/bash
      register: sealed_secrets_apply
      changed_when: "'unchanged' not in sealed_secrets_apply.stdout"
      failed_when: false
      check_mode: false

    - name: Recover from immutable-field conflicts and retry, if needed
      ansible.builtin.include_role:
        name: recreate_immutable_conflicts
      vars:
        recreate_immutable_conflicts_apply: "{{ sealed_secrets_apply }}"
        recreate_immutable_conflicts_namespace: kube-system
      when: sealed_secrets_apply.rc != 0 and not ansible_check_mode

    - name: Abort if the chart still failed to apply
      ansible.builtin.assert:
        that:
          - sealed_secrets_apply.rc == 0 or ansible_check_mode or (recreate_immutable_conflicts_retry.rc | default(1)) == 0
        fail_msg: "the Sealed Secrets chart failed to apply: {{ sealed_secrets_apply.stderr }}"

    - name: Wait for the Sealed Secrets controller to roll out
      ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/sealed-secrets-controller --timeout=180s
      changed_when: false
      check_mode: false
