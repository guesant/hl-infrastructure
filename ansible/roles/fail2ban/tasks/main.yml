---
- name: Install fail2ban and ipset
  ansible.builtin.apt:
    name:
      - fail2ban
      - ipset
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: fail2ban_install

- name: Configure the sshd jail with the firewalld-backed banaction
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  when: not (ansible_check_mode and fail2ban_install.changed)

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: not (ansible_check_mode and fail2ban_install.changed)
