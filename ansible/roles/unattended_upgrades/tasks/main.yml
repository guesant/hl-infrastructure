---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

- name: Configure unattended-upgrades to apply only security updates
  ansible.builtin.template:
    src: 51-unattended-upgrades-security.conf.j2
    dest: /etc/apt/apt.conf.d/51-unattended-upgrades-security.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable the periodic unattended-upgrades timers
  ansible.builtin.template:
    src: 20auto-upgrades-security.conf.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades-security.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades is enabled and running
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started
