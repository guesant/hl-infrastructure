---
- name: Add the Sealed Secrets Helm repository
  ansible.builtin.command: helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
  register: sealed_secrets_repo_add
  changed_when: "'already exists' not in sealed_secrets_repo_add.stderr"
  failed_when: sealed_secrets_repo_add.rc != 0 and 'already exists' not in sealed_secrets_repo_add.stderr

- name: Update the Sealed Secrets Helm repository index
  ansible.builtin.command: helm repo update sealed-secrets
  changed_when: false

- name: Render and apply the Sealed Secrets chart
  ansible.builtin.shell: >
    set -o pipefail &&
    helm template sealed-secrets-controller sealed-secrets/sealed-secrets
    --version {{ sealed_secrets_chart_version }}
    --namespace kube-system
    --include-crds
    | k3s kubectl apply --server-side --force-conflicts -f -
  args:
    executable: /bin/bash
  register: sealed_secrets_apply
  changed_when: "'unchanged' not in sealed_secrets_apply.stdout"

- name: Wait for the Sealed Secrets controller to roll out
  ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/sealed-secrets-controller --timeout=180s
  changed_when: false
