---
- name: Assert the public zone keeps SSH
  ansible.builtin.assert:
    that:
      - "'ssh' in firewall_public_services"
    fail_msg: firewall_public_services must keep ssh, or the operator is locked out

- name: Install firewalld
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: firewall_install

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: not (ansible_check_mode and firewall_install.changed)

- name: Check whether firewalld answers
  ansible.builtin.command: firewall-cmd --state
  register: firewall_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether the firewall rules can be applied in this run
  ansible.builtin.include_role:
    name: check_mode_gate
  vars:
    check_mode_gate_fact: firewall_gate
    check_mode_gate_ok: "{{ firewall_state.rc == 0 and firewall_state.stdout == 'running' }}"
    check_mode_gate_message: >-
      --check on a node without firewalld running: the daemon would only be
      installed and started by a real run, so the zones and rules cannot be
      queried yet; the firewall tasks are skipped from here on

- name: Configure the zones and rules
  when: firewall_gate
  block:
    - name: Keep SSH allowed in the public zone before anything else is touched
      ansible.builtin.command: firewall-cmd --permanent --zone=public --add-service=ssh
      register: firewall_ssh
      changed_when: "'ALREADY_ENABLED' not in firewall_ssh.stderr"

    - name: Allow the declared public services
      ansible.builtin.command: "firewall-cmd --permanent --zone=public --add-service={{ item }}"
      loop: "{{ firewall_public_services }}"
      register: firewall_services
      changed_when: "'ALREADY_ENABLED' not in firewall_services.stderr"

    - name: Trust the pod and service CIDRs
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ item }}"
      loop: "{{ firewall_trusted_sources }}"
      register: firewall_trust
      changed_when: "'ALREADY_ENABLED' not in firewall_trust.stderr"

    - name: Read the permanent zones and policies that exist
      ansible.builtin.command: "firewall-cmd --permanent {{ item }}"
      loop:
        - --get-zones
        - --get-policies
      register: firewall_objects
      changed_when: false
      check_mode: false

    - name: Create the tailnet zone
      ansible.builtin.command: "firewall-cmd --permanent --new-zone={{ firewall_tailscale_zone }}"
      register: firewall_tailscale_zone_created
      changed_when: true
      when: firewall_tailscale_zone not in firewall_objects.results[0].stdout.split()

    - name: Bind the tailnet interface to its zone
      ansible.builtin.command: "firewall-cmd --permanent --zone={{ firewall_tailscale_zone }} --add-interface={{ firewall_tailscale_interface }}"
      register: firewall_tailscale_interface_bound
      changed_when: "'ALREADY_ENABLED' not in firewall_tailscale_interface_bound.stderr"

    - name: Allow the declared services from the tailnet
      ansible.builtin.command: "firewall-cmd --permanent --zone={{ firewall_tailscale_zone }} --add-service={{ item }}"
      loop: "{{ firewall_tailscale_services }}"
      register: firewall_tailscale_services_added
      changed_when: "'ALREADY_ENABLED' not in firewall_tailscale_services_added.stderr"

    - name: Find the policies someone declared on this node
      ansible.builtin.find:
        paths: /etc/firewalld/policies
        patterns: "*.xml"
      register: firewall_user_policies

    - name: Remove every declared forwarding policy, since the node routes nothing between zones
      ansible.builtin.command: "firewall-cmd --permanent --delete-policy={{ item | basename | regex_replace('\\.xml$', '') }}"
      loop: "{{ firewall_user_policies.files | map(attribute='path') | list }}"
      register: firewall_removed_policies
      changed_when: true

    - name: Read the permanent public and trusted zones
      ansible.builtin.command: "firewall-cmd --permanent --zone={{ item.zone }} {{ item.flag }}"
      loop:
        - { key: public_services, zone: public, flag: --list-services }
        - { key: public_ports, zone: public, flag: --list-ports }
        - { key: public_rich_rules, zone: public, flag: --list-rich-rules }
        - { key: trusted_sources, zone: trusted, flag: --list-sources }
      loop_control:
        label: "{{ item.key }}"
      register: firewall_current
      changed_when: false
      check_mode: false

    - name: Read the permanent tailnet zone, which a dry run may not have created yet
      ansible.builtin.command: "firewall-cmd --permanent --zone={{ firewall_tailscale_zone }} --list-services"
      register: firewall_tailscale_current
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Work out which permanent entries nothing declares
      ansible.builtin.set_fact:
        firewall_undeclared:
          services: "{{ firewall_current_by_key.public_services.split() | difference(firewall_public_services) }}"
          ports: "{{ firewall_current_by_key.public_ports.split() | difference(firewall_public_ports) }}"
          rich_rules: "{{ firewall_current_by_key.public_rich_rules.splitlines() | reject('equalto', '') | list }}"
          sources: "{{ firewall_current_by_key.trusted_sources.split() | difference(firewall_trusted_sources) }}"
          tailscale_services: >-
            {{ (firewall_tailscale_current.stdout if firewall_tailscale_current.rc == 0 else '').split()
               | difference(firewall_tailscale_services) }}
      vars:
        firewall_current_by_key: "{{ dict(firewall_current.results | map(attribute='item.key') | zip(firewall_current.results | map(attribute='stdout'))) }}"

    - name: Refuse to remove more undeclared entries than the safety cap allows
      ansible.builtin.assert:
        that:
          - firewall_removal_count | int <= firewall_max_removals
          - "'ssh' not in firewall_undeclared.services"
        fail_msg: >-
          {{ firewall_removal_count }} undeclared firewall entries would be removed, above the cap of
          {{ firewall_max_removals }}: {{ firewall_undeclared }}; declare them or raise firewall_max_removals
          for one run after reviewing the list
      vars:
        firewall_removal_count: >-
          {{ firewall_undeclared.services | length + firewall_undeclared.ports | length
             + firewall_undeclared.rich_rules | length + firewall_undeclared.sources | length
             + firewall_undeclared.tailscale_services | length }}

    - name: Remove undeclared public services
      ansible.builtin.command: "firewall-cmd --permanent --zone=public --remove-service={{ item }}"
      loop: "{{ firewall_undeclared.services }}"
      register: firewall_removed_services
      changed_when: true

    - name: Remove undeclared public ports
      ansible.builtin.command: "firewall-cmd --permanent --zone=public --remove-port={{ item }}"
      loop: "{{ firewall_undeclared.ports }}"
      register: firewall_removed_ports
      changed_when: true

    - name: Remove undeclared public rich rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=public
          - "--remove-rich-rule={{ item }}"
      loop: "{{ firewall_undeclared.rich_rules }}"
      register: firewall_removed_rich_rules
      changed_when: true

    - name: Remove undeclared trusted sources
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --remove-source={{ item }}"
      loop: "{{ firewall_undeclared.sources }}"
      register: firewall_removed_sources
      changed_when: true

    - name: Remove undeclared tailnet services
      ansible.builtin.command: "firewall-cmd --permanent --zone={{ firewall_tailscale_zone }} --remove-service={{ item }}"
      loop: "{{ firewall_undeclared.tailscale_services }}"
      register: firewall_removed_tailscale_services
      changed_when: true

    - name: Read the permanent public zone before reloading
      ansible.builtin.command: firewall-cmd --permanent --zone=public --list-services
      register: firewall_public_services_after
      changed_when: false
      check_mode: false

    - name: Refuse to reload a configuration that would drop SSH
      ansible.builtin.assert:
        that:
          - "'ssh' in firewall_public_services_after.stdout.split()"
        fail_msg: >-
          the permanent public zone does not allow ssh ({{ firewall_public_services_after.stdout }});
          reloading now would lock the operator out, so nothing was reloaded

    - name: Reload firewalld if anything changed
      ansible.builtin.command: firewall-cmd --reload
      when: >-
        firewall_ssh.changed or firewall_services.changed or firewall_trust.changed
        or firewall_tailscale_zone_created.changed or firewall_tailscale_interface_bound.changed
        or firewall_tailscale_services_added.changed or firewall_removed_policies.changed
        or firewall_removed_services.changed or firewall_removed_ports.changed
        or firewall_removed_rich_rules.changed or firewall_removed_sources.changed
        or firewall_removed_tailscale_services.changed
      changed_when: true
