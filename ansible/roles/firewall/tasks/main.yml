---
- name: Assert the operator CIDRs allowed to reach the k3s API are declared
  ansible.builtin.assert:
    that:
      - k3s_api_allowed_cidrs is iterable
      - k3s_api_allowed_cidrs | length > 0
      - k3s_api_allowed_cidrs | reject('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$') | list | length == 0
    fail_msg: >-
      k3s_api_allowed_cidrs must be a non-empty list of IPv4 CIDRs like 203.0.113.0/24,
      got {{ k3s_api_allowed_cidrs | default('undefined') }}

- name: Install firewalld
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true
  register: firewall_install

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: not (ansible_check_mode and firewall_install.changed)

- name: Check whether firewalld answers
  ansible.builtin.command: firewall-cmd --state
  register: firewall_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether the firewall rules can be applied in this run
  ansible.builtin.include_role:
    name: check_mode_gate
  vars:
    check_mode_gate_fact: firewall_gate
    check_mode_gate_ok: "{{ firewall_state.rc == 0 and firewall_state.stdout == 'running' }}"
    check_mode_gate_message: >-
      --check on a node without firewalld running: the daemon would only be
      installed and started by a real run, so the zones and rules cannot be
      queried yet; the firewall tasks are skipped from here on

- name: Configure the zones and rules
  when: firewall_gate
  block:
    - name: Keep SSH allowed in the public zone before anything else is touched
      ansible.builtin.command: firewall-cmd --permanent --zone=public --add-service=ssh
      register: firewall_ssh
      changed_when: "'ALREADY_ENABLED' not in firewall_ssh.stderr"

    - name: Trust the pod and service CIDRs
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-source={{ item }}"
      loop:
        - 10.42.0.0/16
        - 10.43.0.0/16
      register: firewall_trust
      changed_when: "'ALREADY_ENABLED' not in firewall_trust.stderr"

    - name: Allow the k3s API port from the operator CIDRs only
      ansible.builtin.command: >-
        firewall-cmd --permanent --zone=public --add-rich-rule='rule family="ipv4"
        source address="{{ item }}" port protocol="tcp" port="6443" accept'
      loop: "{{ k3s_api_allowed_cidrs }}"
      register: firewall_api_port
      changed_when: "'ALREADY_ENABLED' not in firewall_api_port.stderr"

    - name: Read the permanent public zone before reloading
      ansible.builtin.command: firewall-cmd --permanent --zone=public --list-services
      register: firewall_public_services
      changed_when: false
      check_mode: false

    - name: Refuse to reload a configuration that would drop SSH
      ansible.builtin.assert:
        that:
          - "'ssh' in firewall_public_services.stdout.split()"
        fail_msg: >-
          the permanent public zone does not allow ssh ({{ firewall_public_services.stdout }});
          reloading now would lock the operator out, so nothing was reloaded

    - name: Reload firewalld if anything changed
      ansible.builtin.command: firewall-cmd --reload
      when: firewall_ssh.changed or firewall_trust.changed or firewall_api_port.changed
      changed_when: true
