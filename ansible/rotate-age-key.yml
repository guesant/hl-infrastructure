---
- name: Rotate or prune the node's age identities for sops-secrets-operator
  hosts: pi
  become: true

  vars:
    sops_age_key_prune: false

  tasks:
    - name: Create a private temporary directory for the keypair material
      ansible.builtin.tempfile:
        state: directory
        suffix: rotate-age-key
      register: rotate_age_key_tempdir
      check_mode: false

    - name: Add a new identity alongside the existing ones
      when: not sops_age_key_prune
      block:
        - name: Fetch the current keys.txt from the cluster secret
          ansible.builtin.shell: >-
            set -o pipefail &&
            k3s kubectl -n sops get secret sops-age-key-file -o jsonpath='{.data.keys\.txt}'
            | base64 -d > {{ rotate_age_key_tempdir.path }}/keys.txt
          args:
            executable: /bin/bash
          changed_when: false
          no_log: true

        - name: Generate a new age identity
          ansible.builtin.command: age-keygen -o {{ rotate_age_key_tempdir.path }}/new.txt
          changed_when: true
          no_log: true

        - name: Append the new identity to keys.txt
          ansible.builtin.shell: >-
            cat {{ rotate_age_key_tempdir.path }}/new.txt >> {{ rotate_age_key_tempdir.path }}/keys.txt
          changed_when: true
          no_log: true

    - name: Keep only the most recently generated identity
      when: sops_age_key_prune
      block:
        - name: Fetch the current keys.txt from the cluster secret
          ansible.builtin.shell: >-
            set -o pipefail &&
            k3s kubectl -n sops get secret sops-age-key-file -o jsonpath='{.data.keys\.txt}'
            | base64 -d > {{ rotate_age_key_tempdir.path }}/all.txt
          args:
            executable: /bin/bash
          changed_when: false
          no_log: true

        - name: Keep only the block starting at the last "# created:" marker
          ansible.builtin.shell: >-
            set -o pipefail &&
            awk 'BEGIN{start=0} /^# created:/{start=NR} {lines[NR]=$0}
            END{for (i=start; i<=NR; i++) print lines[i]}'
            {{ rotate_age_key_tempdir.path }}/all.txt > {{ rotate_age_key_tempdir.path }}/keys.txt
          args:
            executable: /bin/bash
          changed_when: true
          no_log: true

    - name: Recreate the age key secret from the resulting keys.txt
      ansible.builtin.shell: >-
        set -o pipefail &&
        k3s kubectl -n sops create secret generic sops-age-key-file
        --from-file=keys.txt={{ rotate_age_key_tempdir.path }}/keys.txt
        --dry-run=client -o yaml
        | k3s kubectl apply --server-side --force-conflicts -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Remove the temporary directory holding the keypair material
      ansible.builtin.file:
        path: "{{ rotate_age_key_tempdir.path }}"
        state: absent

    - name: Restart sops-secrets-operator to pick up the new identity
      ansible.builtin.command: k3s kubectl -n sops rollout restart deployment/sops-secrets-operator
      changed_when: true

    - name: Wait for sops-secrets-operator to roll out
      ansible.builtin.command: k3s kubectl -n sops rollout status deployment/sops-secrets-operator --timeout=120s
      changed_when: false

    - name: Read the current public key so it can be added to .sops.yaml
      ansible.builtin.shell: >-
        set -o pipefail &&
        k3s kubectl -n sops get secret sops-age-key-file -o jsonpath='{.data.keys\.txt}'
        | base64 -d | age-keygen -y | tail -n1
      args:
        executable: /bin/bash
      register: rotate_age_key_public
      changed_when: false

    - name: Print the current public key and the follow-up steps
      ansible.builtin.debug:
        msg: >-
          {{ 'Pruned to a single identity.' if sops_age_key_prune else 'Added a new identity; the old one still decrypts until pruned.' }}
          Current public key: {{ rotate_age_key_public.stdout }}.
          {{ 'Nothing else to do.' if sops_age_key_prune else
             'Next: just sops-recipients sync-node, just sops-sync, review and commit, then just rotate-age-key -e sops_age_key_prune=true.' }}
