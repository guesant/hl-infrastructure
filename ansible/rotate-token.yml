---
- name: Rotate the k3s node join token to the value declared in secrets.sops.yaml
  hosts: pi
  become: true

  tasks:
    - name: Assert the declared token is a generated secret
      ansible.builtin.assert:
        that:
          - k3s_join_token | length >= 32
        fail_msg: >-
          k3s_join_token must be a generated secret of at least 32 characters; edit it with
          `just sops-edit ansible/group_vars/all/secrets.sops.yaml` before rotating

    - name: Read the current token
      ansible.builtin.slurp:
        path: /var/lib/rancher/k3s/server/token
      register: rotate_token_current
      no_log: true

    - name: Work out whether the node already has the declared token
      ansible.builtin.set_fact:
        rotate_token_needed: "{{ (rotate_token_current.content | b64decode | trim) != k3s_join_token }}"

    - name: Report when the node already matches the declared token
      ansible.builtin.debug:
        msg: "the node's k3s token already matches k3s_join_token; nothing to rotate"
      when: not rotate_token_needed

    - name: Rotate the token
      ansible.builtin.command: >-
        k3s token rotate
        --token {{ rotate_token_current.content | b64decode | trim }}
        --new-token {{ k3s_join_token }}
      changed_when: true
      no_log: true
      when: rotate_token_needed

    - name: Rewrite the k3s config with the declared token before restarting
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/k3s/templates/config.yaml.j2"
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      no_log: true
      when: rotate_token_needed

    - name: Restart k3s so the new token takes effect
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: rotate_token_needed

    - name: Wait for the k3s API server to answer
      ansible.builtin.command: k3s kubectl get --raw /healthz
      register: rotate_token_healthz
      until: rotate_token_healthz.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: rotate_token_needed
