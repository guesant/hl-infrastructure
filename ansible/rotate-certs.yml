---
- name: Rotate the k3s certificates and refresh the local kubeconfig
  hosts: pi
  become: true

  tasks:
    - name: Stop k3s
      ansible.builtin.systemd:
        name: k3s
        state: stopped

    - name: Rotate every k3s certificate
      ansible.builtin.command: k3s certificate rotate
      changed_when: true

    - name: Start k3s
      ansible.builtin.systemd:
        name: k3s
        state: started

    - name: Wait for the k3s API server to answer with the new certificates
      ansible.builtin.command: k3s kubectl get --raw /healthz
      register: rotate_certs_healthz
      until: rotate_certs_healthz.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Fetch the kubeconfig back to the control machine
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

    - name: Point the fetched kubeconfig at the real host
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: "https://{{ ansible_host }}:6443"
      delegate_to: localhost
      become: false
