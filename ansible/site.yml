---
- name: Bootstrap the k3s cluster
  hosts: pi
  become: true
  roles:
    - os_prerequisites
    - firewall
    - tailscale
    - unattended_upgrades
    - sysctl_hardening
    - umask_hardening
    - apparmor_hardening
    - auditd
    - ssh_hardening
    - fail2ban
    - k3s
    - cilium
    - sops_age_key
    - argocd
    - bootstrap_app
    - maintenance
    - kube_bench
