---
- name: Bootstrap the k3s cluster
  hosts: pi
  become: true
  roles:
    - os_prerequisites
    - firewall
    - unattended_upgrades
    - sysctl_hardening
    - umask_hardening
    - apparmor_hardening
    - auditd
    - ssh_hardening
    - fail2ban
    - k3s
    - cilium
    - cnpg
    - cert_manager
    - cnpg_barman_plugin
    - argocd
    - sealed_secrets
    - argocd_image_updater
    - bootstrap_app
    - maintenance
