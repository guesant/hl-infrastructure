title = "gitleaks config for hl-infrastructure"

[extend]
useDefault = true

[allowlist]
regexTarget = "line"
regexes = [
  '''changeme-generate-a-real-secret''', # placeholder-lint: ignore
  '''changeme@example\.invalid''', # placeholder-lint: ignore
  '''_sha256:\s*"?[0-9a-f]{64}"?''',
]

[[rules]]
id = "age-secret-key"
description = "age X25519 private key"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''

[[rules]]
id = "age-plugin-se-identity"
description = "age-plugin-se Secure Enclave identity file"
regex = '''AGE-PLUGIN-SE-1[0-9A-Z]+'''
