site_name: hl-infrastructure
site_description: Bootstrap via Ansible e estado contínuo via GitOps para o cluster k3s do homelab
site_url: https://guesant.github.io/hl-infrastructure/
repo_url: https://github.com/guesant/hl-infrastructure
repo_name: guesant/hl-infrastructure
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: ../.build/site

exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

nav:
  - Visão geral: index.md
  - Aprender:
      - aprender/index.md
      - "CPU, privilégios e syscalls": aprender/cpu-privilegios-e-syscalls.md
      - Como os SOs expõem serviços: aprender/como-os-expoe-servicos.md
      - Famílias e padrões Unix: aprender/unix-familias-e-padroes.md
      - Shells e scripts: aprender/shells-e-scripts.md
      - Coreutils e documentação: aprender/coreutils-e-documentacao.md
      - Máquinas virtuais e hipervisores: aprender/vms-e-hipervisores.md
      - "Isolamento leve: zones, jails e microVMs": aprender/isolamento-leve-zones-jails-e-microvms.md
      - Wine e compatibilidade: aprender/wine-e-compatibilidade.md
      - Processo, namespaces e usuários num container: aprender/processo-namespaces-e-usuarios.md
      - Cgroups, capabilities e isolamento de filesystem: aprender/cgroups-capabilities-e-filesystem.md
      - Especificações OCI e a pilha de runtimes: aprender/especificacoes-oci-e-pilha-de-runtimes.md
      - Imagens, registries e Compose: aprender/imagens-registries-e-compose.md
      - "DevOps, IaC e GitOps": aprender/devops-iac-gitops.md
      - Infraestrutura como código: aprender/iac-provisionamento.md
      - Ansible: aprender/ansible.md
      - SSH: aprender/ssh.md
      - firewalld: aprender/firewalld.md
      - k3s: aprender/k3s.md
      - Rede interna do cluster: aprender/rede-interna-do-cluster.md
      - TLS automático: aprender/tls-automatico.md
      - "ArgoCD e GitOps": aprender/argocd.md
      - Operators do Kubernetes: aprender/kubernetes-operators.md
      - Helm e charts: aprender/helm-e-charts.md
      - "CI/CD": aprender/ci-cd.md
      - Scanning de vulnerabilidade: aprender/vulnerability-scanning.md
      - Supply chain e SBOM: aprender/supply-chain-e-sbom.md
      - Threat modeling: aprender/threat-modeling.md
      - Criptografia de segredos no Git: aprender/criptografia-de-segredos-no-git.md
      - Bootstrap e rotação de segredos: aprender/bootstrap-e-rotacao-de-segredos.md
      - Secret store externo: aprender/secret-store-externo.md
      - OWASP: aprender/owasp.md
      - MITRE ATT&CK: aprender/mitre-attack.md
      - Zero trust: aprender/zero-trust.md
      - Diátaxis: aprender/diataxis.md
      - "Gerar várias instâncias com Helm": aprender/helm-templating-de-lista.md
  - Arquitetura:
      - arquitetura/index.md
      - "Ansible: as roles do bootstrap": arquitetura/ansible.md
      - Helm e os charts: arquitetura/helm-e-charts.md
      - "GitOps: root e satélites": arquitetura/gitops-root-e-satelites.md
      - "OpenTofu: a camada da Cloudflare": arquitetura/opentofu.md
      - "Tailscale: acesso remoto e DNS interno": arquitetura/tailscale.md
      - "Ingress: os nomes internos pela tailnet": arquitetura/ingress.md
      - Rollout de imagens: arquitetura/rollout-de-imagens.md
      - A pipeline de CI: arquitetura/ci.md
      - Modelo de ameaças: arquitetura/modelo-de-ameacas.md
      - Mapa de controles: arquitetura/mapa-de-controles.md
      - Checklist de segurança: arquitetura/checklist-de-seguranca.md
      - Variáveis: arquitetura/variaveis.md
  - Operacional:
      - operacional/index.md
      - Primeiro bootstrap: operacional/primeiro-bootstrap.md
      - Mapa do bootstrap e das credenciais: operacional/mapa-do-bootstrap-e-das-credenciais.md
      - Metodologia de mudança: operacional/metodologia-de-mudanca.md
      - Checklist operacional: operacional/checklist.md
      - Preflight e dry-run do bootstrap: operacional/preflight-e-dry-run.md
      - Rotacionar credenciais: operacional/rotacionar-credenciais.md
      - Renderizar os charts localmente: operacional/renderizar-charts-localmente.md
      - Rodar os quality gates localmente: operacional/rodar-quality-gates-localmente.md
      - Adicionar um satélite novo: operacional/adicionar-um-satelite.md
      - Estado fora do git: operacional/estado-fora-do-git.md
      - Restaurar um volume retido: operacional/restaurar-um-volume-retido.md
      - Restaurar o node do zero: operacional/restaurar-o-node.md
      - Resposta a incidente: operacional/resposta-a-incidente.md
      - Revisão periódica: operacional/revisao-periodica.md
  - Contribuindo:
      - contribuindo/index.md
      - Convenções de escrita: contribuindo/convencoes-de-escrita.md
      - Normas de redação técnica: contribuindo/normas-de-redacao-tecnica.md
      - Voz e tom: contribuindo/voz-e-tom.md
      - Aviso sobre conteúdo assistido por IA: contribuindo/aviso-sobre-ia.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search
