extends: default

ignore:
  - .build/
  - .cache/
  - ansible/group_vars/all/secrets.sops.yaml
  - ansible/group_vars/all/authorized_keys.yml
  - "**/*.sops-secret.yaml"
  - argocd/apps/satellites/launcher/templates/
  - argocd/apps/satellites/delivery/templates/
  - argocd/apps/satellites/blog/blog/templates/
  - argocd/apps/satellites/blog/delivery/templates/

rules:
  braces:
    max-spaces-inside: 1
  line-length:
    max: 200
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
