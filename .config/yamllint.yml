extends: default

ignore:
  - rendered/
  - site/
  - .kubeconform-cache/
  - ansible/group_vars/all/secrets.yml
  - ansible/group_vars/all/secrets.sops.yaml
  - "**/*.sops-secret.yaml"
  - argocd/apps/operators/keycloak-operator/crds/

rules:
  braces:
    max-spaces-inside: 1
  line-length:
    max: 200
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
