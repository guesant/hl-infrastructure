id: no-narrative-comments
language: yaml
severity: error
message: "narrative comment not allowed; only tool-directive comments and an IMPORTANT: marker for a critical non-obvious invariant are permitted"
ignores:
  - ".sops.yaml"
rule:
  kind: comment
  not:
    regex: "^#!|^#\\s*(v?[0-9]+\\.[0-9]+(\\.[0-9]+)?$|IMPORTANT:|shellcheck|yamllint|biome-ignore|eslint-ignore|eslint-disable|nosemgrep|noqa|zizmor:\\s*ignore)"
