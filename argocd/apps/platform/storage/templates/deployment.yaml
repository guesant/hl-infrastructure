# yamllint disable-file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
{{ toYaml .Values.deployment.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      priorityClassName: {{ .Values.priorityClassName }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      tolerations:
{{ toYaml .Values.deployment.tolerations | nindent 8 }}
      nodeSelector:
{{ toYaml .Values.deployment.nodeSelector | nindent 8 }}
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
{{ toYaml .Values.command | nindent 12 }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: {{ .Values.deployment.volumeMount.name }}
              mountPath: {{ .Values.deployment.volumeMount.mountPath }}
          env:
{{ toYaml .Values.deployment.env | nindent 12 }}
      volumes:
        - name: {{ .Values.deployment.volume.name }}
          {{ .Values.deployment.volume.type }}:
            name: {{ .Values.config.name }}
# yamllint disable-file
