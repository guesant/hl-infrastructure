apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-image-digest
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: variables.containers.all(c, c.image.contains('@sha256:'))
      messageExpression: >-
        'every image must be pinned by digest: '
        + variables.containers.filter(c, !c.image.contains('@sha256:')).map(c, c.image).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: allowed-registries
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: allowed
      expression: >-
        ['quay.io/', 'ghcr.io/', 'docker.io/aquasec/', 'docker.io/cloudflare/', 'cloudflare/', 'ecr-public.aws.com/docker/library/']
  validations:
    - expression: variables.containers.all(c, variables.allowed.exists(p, c.image.startsWith(p)))
      messageExpression: >-
        'image from a registry outside the allowlist: '
        + variables.containers.filter(c, !variables.allowed.exists(p, c.image.startsWith(p))).map(c, c.image).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hardened-security-context
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: podNonRoot
      expression: >-
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
        && object.spec.securityContext.runAsNonRoot
  validations:
    - expression: >-
        variables.containers.all(c, has(c.securityContext)
        && has(c.securityContext.allowPrivilegeEscalation)
        && !c.securityContext.allowPrivilegeEscalation)
      message: every container must set allowPrivilegeEscalation to false
    - expression: >-
        variables.containers.all(c, variables.podNonRoot
        || (has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot))
      message: every container must run with runAsNonRoot
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
        && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.exists(d, d == 'ALL'))
      message: every container must drop ALL capabilities
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-image-digest
spec:
  policyName: require-image-digest
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: allowed-registries
spec:
  policyName: allowed-registries
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hardened-security-context
spec:
  policyName: hardened-security-context
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
