apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: homelab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    GOOGLE_CLIENT_ID:
      secret:
        name: keycloak-realm
        key: GOOGLE_CLIENT_ID
    GOOGLE_CLIENT_SECRET:
      secret:
        name: keycloak-realm
        key: GOOGLE_CLIENT_SECRET
    ADMIN_EMAIL:
      secret:
        name: keycloak-realm
        key: ADMIN_EMAIL
    ARGOCD_CLIENT_SECRET:
      secret:
        name: keycloak-realm
        key: ARGOCD_CLIENT_SECRET
    GRAFANA_CLIENT_SECRET:
      secret:
        name: keycloak-realm
        key: GRAFANA_CLIENT_SECRET
    BLOG_CLIENT_SECRET:
      secret:
        name: keycloak-realm
        key: BLOG_CLIENT_SECRET
  realm:
    realm: homelab
    enabled: true
    sslRequired: external
    registrationAllowed: false
    resetPasswordAllowed: false
    rememberMe: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    bruteForceProtected: true
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 28800
    ssoSessionMaxLifespan: 86400
    groups:
      - name: homelab-admins
    users:
      - username: ${ADMIN_EMAIL}
        email: ${ADMIN_EMAIL}
        emailVerified: true
        enabled: true
        groups:
          - /homelab-admins
    authenticationFlows:
      - alias: existing-users-only
        description: Links a Google sign-in to a user that already exists in the realm and refuses everyone else
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - authenticator: idp-detect-existing-broker-user
            requirement: REQUIRED
            priority: 10
            authenticatorFlow: false
            userSetupAllowed: false
          - authenticator: idp-auto-link
            requirement: REQUIRED
            priority: 20
            authenticatorFlow: false
            userSetupAllowed: false
    identityProviders:
      - alias: google
        providerId: google
        enabled: true
        trustEmail: true
        storeToken: false
        firstBrokerLoginFlowAlias: existing-users-only
        config:
          clientId: ${GOOGLE_CLIENT_ID}
          clientSecret: ${GOOGLE_CLIENT_SECRET}
          syncMode: IMPORT
          defaultScope: openid email profile
    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
    clients:
      - clientId: argocd
        name: Argo CD
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        secret: ${ARGOCD_CLIENT_SECRET}
        redirectUris:
          - https://argocd.guesant.internal/auth/callback
        webOrigins:
          - https://argocd.guesant.internal
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://argocd.guesant.internal/*
        defaultClientScopes:
          - openid
          - profile
          - email
          - groups
      - clientId: grafana
        name: Grafana
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        secret: ${GRAFANA_CLIENT_SECRET}
        redirectUris:
          - https://grafana.guesant.internal/login/generic_oauth
        webOrigins:
          - https://grafana.guesant.internal
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://grafana.guesant.internal/*
        defaultClientScopes:
          - openid
          - profile
          - email
          - groups
      - clientId: blog
        name: guesant.net
        enabled: true
        protocol: openid-connect
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        secret: ${BLOG_CLIENT_SECRET}
        redirectUris:
          - https://guesant.net/signin-oidc
        webOrigins:
          - https://guesant.net
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://guesant.net/signout-callback-oidc
        defaultClientScopes:
          - openid
          - profile
          - email
          - groups
