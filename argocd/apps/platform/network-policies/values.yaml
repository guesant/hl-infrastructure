              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEntities:
          - kube-apiserver
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: data
              cnpg.io/cluster: postgres
