policies: |-
  apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    name: argocd
    namespace: argocd
  spec:
    endpointSelector: {}
    ingress:
      - fromEndpoints:
          - {}
      - fromEntities:
          - host
          - remote-node
          - kube-apiserver
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: blog
              app.kubernetes.io/name: cloudflared
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      - toEndpoints:
          - {}
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEntities:
          - kube-apiserver
      - toEntities:
          - world
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  ---
  apiVersion: cilium.io/v2
