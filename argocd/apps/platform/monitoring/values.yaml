kube-prometheus-stack:
  fullnameOverride: kps
  grafana:
    enabled: true
    fullnameOverride: kps-grafana
    image:
      sha: 3600073f45a9895d2e2c4042da0e745819f5b78bf781266952a400c40dcd8d69
    testFramework:
      enabled: false
    initChownData:
      enabled: false
    defaultDashboardsTimezone: America/Sao_Paulo
    annotations:
      reloader.stakater.com/auto: "true"
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client_secret
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    startupProbe:
      httpGet:
        path: /api/health
        port: grafana
      periodSeconds: 10
      failureThreshold: 36
    readinessProbe:
      httpGet:
        path: /api/health
        port: grafana
      timeoutSeconds: 10
    grafana.ini:
      server:
        root_url: https://grafana.guesant.internal
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      news:
        news_feed_enabled: false
      users:
        allow_sign_up: false
        auto_assign_org_role: Viewer
      auth:
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        auto_login: true
        name: Keycloak
        allow_sign_up: true
        use_pkce: true
        client_id: grafana
        scopes: openid profile email groups
        auth_url: https://auth.guesant.net/realms/management/protocol/openid-connect/auth
        token_url: https://auth.guesant.net/realms/management/protocol/openid-connect/token
        api_url: https://auth.guesant.net/realms/management/protocol/openid-connect/userinfo
        signout_redirect_url: https://auth.guesant.net/realms/management/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.guesant.internal%2Flogin
        login_attribute_path: preferred_username
        email_attribute_path: email
        name_attribute_path: name
        role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
        role_attribute_strict: true
        allow_assign_grafana_admin: true
    sidecar:
      image:
        sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    resources:
      requests:
        cpu: 30m
        memory: 256Mi
      limits:
        memory: 640Mi
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes)_bucket
          action: drop
        - sourceLabels: [__name__]
          regex: (apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|etcd_request_duration_seconds)_bucket
          action: drop
        - sourceLabels: [__name__]
          regex: (workqueue_work_duration_seconds|workqueue_queue_duration_seconds)_bucket
          action: drop
  kubelet:
    serviceMonitor:
      cAdvisorMetricRelabelings:
        - sourceLabels: [__name__]
          regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|memory_failures_total|blkio_device_usage_total)
          action: drop
        - sourceLabels: [__name__]
          regex: container_(file_descriptors|sockets|threads_max|spec_.*|start_time_seconds|last_seen)
          action: drop
        - sourceLabels: [container]
          regex: POD
          action: drop
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  coreDns:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeProxy: false
      windows: false

  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false
    image:
      sha: cf153f64d6c38113fceb2cda7642365ea887f71edd7888f054e43e54cf177e55
    prometheusConfigReloader:
      image:
        sha: 142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

  prometheus:
    prometheusSpec:
      image:
        sha: 50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
      retention: 15d
      retentionSize: 6GB
      scrapeInterval: 60s
      evaluationInterval: 60s
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 8Gi

  alertmanager:
    alertmanagerSpec:
      image:
        sha: 690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

  kube-state-metrics:
    image:
      sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

  prometheus-node-exporter:
    image:
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    hostPID: false
    daemonsetAnnotations:
      ignore-check.kube-linter.io/host-network: node-exporter reads the host network interfaces
      ignore-check.kube-linter.io/sensitive-host-mounts: node-exporter reads the host filesystems read-only
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi

prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter
  image:
    digest: sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
