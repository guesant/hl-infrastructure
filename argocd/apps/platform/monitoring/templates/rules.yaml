apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: host
      rules:
        - alert: HostRootFilesystemAlmostFull
          expr: >-
            node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Less than 15% free on the node root filesystem
        - alert: HostMemoryLow
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Less than 10% of the node memory available
        - alert: HostHighTemperature
          expr: max(node_thermal_zone_temp) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The Raspberry Pi SoC is above 80 C and will start throttling
        - alert: HostRebooted
          expr: time() - node_boot_time_seconds < 600
          labels:
            severity: info
          annotations:
            summary: The node rebooted in the last ten minutes
        - alert: HostExporterDown
          expr: absent(up{job="node-exporter"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No node-exporter target is up, host alerts are blind
    - name: public-endpoints
      rules:
        - alert: EndpointDown
          expr: probe_success{job="probe/monitoring/public-endpoints"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{`{{ $labels.instance }}`}} has failed the blackbox probe for five minutes"
        - alert: EndpointCertificateExpiring
          expr: probe_ssl_earliest_cert_expiry{job="probe/monitoring/public-endpoints"} - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The TLS certificate of {{`{{ $labels.instance }}`}} expires in less than 14 days"
    - name: cluster
      rules:
        - alert: PersistentVolumeAlmostFull
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}`}} has less than 15% free"
