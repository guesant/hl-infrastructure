# yamllint disable-file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
{{ toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}
          args:
{{ toYaml .Values.args | nindent 12 }}
          ports:
{{ toYaml .Values.ports | nindent 12 }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
{{ toYaml .Values.volumeMounts | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ index .Values.ports 0 "name" }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ index .Values.ports 0 "name" }}
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelaySeconds }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
      volumes:
{{- range .Values.volumes }}
        - name: {{ .name }}
{{- if eq .type "emptyDir" }}
          emptyDir: {}
{{- else if eq .type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ .claimName }}
{{- else if eq .type "secret" }}
          secret:
            secretName: {{ .secretName }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: {{ index .Values.ports 0 "name" }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
# yamllint disable-file
