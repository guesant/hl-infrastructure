# yamllint disable-file
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.oidcJob.name }}-script
  namespace: {{ .Values.namespace }}
data:
  configure.py: |
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    base = os.environ["PORTAINER_API_BASE"]
    issuer = os.environ["ISSUER"]
    public_url = os.environ["PUBLIC_URL"]


    def call(method, path, body=None, token=None):
        data = json.dumps(body).encode() if body is not None else None
        request = urllib.request.Request(base + path, data=data, method=method)
        request.add_header("Content-Type", "application/json")
        if token:
            request.add_header("Authorization", "Bearer " + token)
        with urllib.request.urlopen(request, timeout=30) as response:
            raw = response.read()
            return json.loads(raw) if raw else None


    for attempt in range(60):
        try:
            call("GET", "/system/status")
            break
        except (urllib.error.URLError, urllib.error.HTTPError):
            time.sleep(5)
    else:
        sys.exit("portainer did not answer in time")

    token = call("POST", "/auth", {"Username": os.environ["BOOTSTRAP_USERNAME"], "Password": os.environ["ADMIN_PASSWORD"]})["jwt"]

    call("PUT", "/settings", {
        "AuthenticationMethod": int(os.environ["AUTHENTICATION_METHOD"]),
        "OAuthSettings": {
            "ClientID": os.environ["CLIENT_ID"],
            "ClientSecret": os.environ["CLIENT_SECRET"],
            "AccessTokenURI": issuer + "/protocol/openid-connect/token",
            "AuthorizationURI": issuer + "/protocol/openid-connect/auth",
            "ResourceURI": issuer + "/protocol/openid-connect/userinfo",
            "RedirectURI": os.environ["REDIRECT_URI"],
            "LogoutURI": issuer + "/protocol/openid-connect/logout?client_id=" + os.environ["CLIENT_ID"] + "&post_logout_redirect_uri=" + urllib.parse.quote(public_url, safe=""),
            "UserIdentifier": os.environ["USER_IDENTIFIER"],
            "Scopes": os.environ["SCOPES"],
            "OAuthAutoCreateUsers": os.environ["AUTO_CREATE_USERS"].lower() == "true",
            "DefaultTeamID": int(os.environ["DEFAULT_TEAM_ID"]),
            "SSO": True,
            "HideInternalAuth": True,
            "AuthStyle": 0,
        },
    }, token)

    operator = os.environ["OPERATOR_USERNAME"]
    users = call("GET", "/users", token=token)
    existing = [u for u in users if u["Username"] == operator]
    if not existing:
        call("POST", "/users", {"Username": operator, "Password": os.environ["OPERATOR_PASSWORD"], "Role": int(os.environ["OPERATOR_ROLE"])}, token)
        print("created the operator as a Portainer administrator")
    elif existing[0]["Role"] != int(os.environ["OPERATOR_ROLE"]):
        call("PUT", "/users/%d" % existing[0]["Id"], {"Role": int(os.environ["OPERATOR_ROLE"])}, token)
        print("promoted the operator to Portainer administrator")
    print("oauth settings applied against " + issuer)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.oidcJob.name }}
  namespace: {{ .Values.namespace }}
  annotations:
{{ toYaml .Values.oidcJob.hook | nindent 4 }}
spec:
  backoffLimit: {{ .Values.oidcJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.oidcJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.oidcJob.name }}
    spec:
      restartPolicy: {{ .Values.oidcJob.restartPolicy }}
      automountServiceAccountToken: {{ .Values.oidcJob.pod.automountServiceAccountToken }}
      securityContext:
{{ toYaml .Values.oidcJob.pod.securityContext | nindent 8 }}
      containers:
        - name: {{ .Values.oidcJob.container.name }}
          image: {{ .Values.oidcJob.image.repository }}:{{ .Values.oidcJob.image.tag }}@{{ .Values.oidcJob.image.digest }}
          command:
{{ toYaml .Values.oidcJob.container.command | nindent 12 }}
          env:
            - name: ISSUER
              value: {{ .Values.oidcJob.issuer }}
            - name: PUBLIC_URL
              value: {{ .Values.oidcJob.publicUrl }}
            - name: PORTAINER_API_BASE
              value: {{ .Values.oidcJob.apiBase }}
            - name: BOOTSTRAP_USERNAME
              value: {{ .Values.oidcJob.bootstrapUsername }}
            - name: AUTHENTICATION_METHOD
              value: {{ .Values.oidcJob.authenticationMethod | quote }}
            - name: CLIENT_ID
              value: {{ .Values.oidcJob.clientId }}
            - name: REDIRECT_URI
              value: {{ .Values.oidcJob.redirectUri }}
            - name: USER_IDENTIFIER
              value: {{ .Values.oidcJob.userIdentifier }}
            - name: SCOPES
              value: {{ .Values.oidcJob.scopes }}
            - name: AUTO_CREATE_USERS
              value: {{ .Values.oidcJob.autoCreateUsers | quote }}
            - name: DEFAULT_TEAM_ID
              value: {{ .Values.oidcJob.defaultTeamId | quote }}
            - name: OPERATOR_USERNAME
              value: {{ .Values.oidcJob.operatorUsername }}
            - name: OPERATOR_PASSWORD
              value: {{ .Values.oidcJob.operatorPassword | quote }}
            - name: OPERATOR_ROLE
              value: {{ .Values.oidcJob.operatorRole | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin }}
                  key: password
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidc }}
                  key: client-secret
          securityContext:
{{ toYaml .Values.oidcJob.container.securityContext | nindent 12 }}
          volumeMounts:
            - name: {{ .Values.oidcJob.volumeMount.name }}
              mountPath: {{ .Values.oidcJob.volumeMount.mountPath }}
              readOnly: {{ .Values.oidcJob.volumeMount.readOnly }}
          resources:
{{ toYaml .Values.oidcJob.container.resources | nindent 12 }}
      volumes:
        - name: {{ .Values.oidcJob.volumeMount.name }}
          configMap:
            name: {{ .Values.oidcJob.name }}-script
