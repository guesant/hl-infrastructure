apiVersion: v1
kind: ConfigMap
metadata:
  name: portainer-oidc-script
  namespace: portainer
data:
  configure.py: |
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    base = "http://portainer:9000/api"
    issuer = os.environ["ISSUER"]
    public_url = os.environ["PUBLIC_URL"]


    def call(method, path, body=None, token=None):
        data = json.dumps(body).encode() if body is not None else None
        request = urllib.request.Request(base + path, data=data, method=method)
        request.add_header("Content-Type", "application/json")
        if token:
            request.add_header("Authorization", "Bearer " + token)
        with urllib.request.urlopen(request, timeout=30) as response:
            raw = response.read()
            return json.loads(raw) if raw else None


    for attempt in range(60):
        try:
            call("GET", "/system/status")
            break
        except (urllib.error.URLError, urllib.error.HTTPError):
            time.sleep(5)
    else:
        sys.exit("portainer did not answer in time")

    token = call("POST", "/auth", {"Username": "admin", "Password": os.environ["ADMIN_PASSWORD"]})["jwt"]

    call("PUT", "/settings", {
        "AuthenticationMethod": 3,
        "OAuthSettings": {
            "ClientID": "portainer",
            "ClientSecret": os.environ["CLIENT_SECRET"],
            "AccessTokenURI": issuer + "/protocol/openid-connect/token",
            "AuthorizationURI": issuer + "/protocol/openid-connect/auth",
            "ResourceURI": issuer + "/protocol/openid-connect/userinfo",
            "RedirectURI": public_url,
            "LogoutURI": issuer + "/protocol/openid-connect/logout?client_id=portainer&post_logout_redirect_uri=" + urllib.parse.quote(public_url, safe=""),
            "UserIdentifier": "preferred_username",
            "Scopes": "openid email profile",
            "OAuthAutoCreateUsers": False,
            "DefaultTeamID": 0,
            "SSO": True,
            "HideInternalAuth": True,
            "AuthStyle": 0,
        },
    }, token)

    operator = os.environ["OPERATOR_USERNAME"]
    users = call("GET", "/users", token=token)
    existing = [u for u in users if u["Username"] == operator]
    if not existing:
        call("POST", "/users", {"Username": operator, "Password": "", "Role": 1}, token)
        print("created the operator as a Portainer administrator")
    elif existing[0]["Role"] != 1:
        call("PUT", "/users/%d" % existing[0]["Id"], {"Role": 1}, token)
        print("promoted the operator to Portainer administrator")
    print("oauth settings applied against " + issuer)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: portainer-oidc
  namespace: portainer
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portainer-oidc
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: ghcr.io/astral-sh/uv:python3.13-alpine@sha256:e20433e476f56f543355bcef972d93813d050d0884ad5a570d8d0d291c317194
          command: [python3, /scripts/configure.py]
          env:
            - name: ISSUER
              value: https://auth.guesant.net/realms/management
            - name: PUBLIC_URL
              value: https://portainer.guesant.internal
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portainer-admin
                  key: password
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portainer-oidc
                  key: client-secret
            - name: OPERATOR_USERNAME
              value: gabriel
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: script
          configMap:
            name: portainer-oidc-script
