{{- $root := . }}
{{- range .Values.routes }}
{{- if or (not .monitoringOnly) $root.Values.monitoring.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - group: {{ $root.Values.gateway.group }}
      kind: {{ $root.Values.gateway.kind }}
      name: {{ $root.Values.gateway.name }}
      namespace: {{ $root.Values.gateway.namespace }}
      sectionName: {{ $root.Values.gateway.sectionName }}
  hostnames:
{{ toYaml .hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: {{ $root.Values.route.pathType }}
            value: {{ .path }}
{{- if .auth }}
      filters:
        - type: {{ $root.Values.route.filterType }}
          extensionRef:
            group: {{ $root.Values.route.filterGroup }}
            kind: {{ $root.Values.route.filterKind }}
            name: {{ $root.Values.authMiddleware.name }}
{{- end }}
      backendRefs:
        - group: {{ $root.Values.route.backendGroup | quote }}
          kind: {{ $root.Values.route.backendKind }}
          name: {{ .serviceName }}
          port: {{ .servicePort }}
          weight: {{ $root.Values.route.backendWeight }}
{{- end }}
{{- end }}
