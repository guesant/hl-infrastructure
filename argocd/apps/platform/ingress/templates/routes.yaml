apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: internal
      namespace: ingress
      sectionName: websecure
  hostnames:
    - argocd.guesant.internal
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: internal
      namespace: ingress
      sectionName: websecure
  hostnames:
    - keycloak.guesant.internal
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
