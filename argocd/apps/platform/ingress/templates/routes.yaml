apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: ingress
      sectionName: websecure
  hostnames:
    - prometheus.guesant.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: keycloak-login
      backendRefs:
        - group: ""
          kind: Service
          name: kps-prometheus
          port: 9090
          weight: 1
---
