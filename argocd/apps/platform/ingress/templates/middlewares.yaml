apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-login
  namespace: monitoring
spec:
  chain:
    middlewares:
      - name: keycloak-login-redirect
      - name: keycloak-login-check
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-login-check
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-login-redirect
  namespace: monitoring
spec:
  errors:
    status:
      - "401"
    service:
      name: oauth2-proxy
      namespace: oauth2-proxy
      port: 4180
    query: /oauth2/sign_in?rd={url}
---
