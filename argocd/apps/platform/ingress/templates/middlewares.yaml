{{- if .Values.monitoring.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-login
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
{{- end }}
