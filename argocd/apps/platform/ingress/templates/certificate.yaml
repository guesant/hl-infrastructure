apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-domain
  namespace: ingress
spec:
  secretName: internal-domain-tls
  dnsNames:
    - "*.guesant.internal"
    - guesant.internal
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: internal-ca
