apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-runtime-credentials
  namespace: atlas
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: data-secrets
  target:
    name: atlas-runtime-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: atlas-postgres-app-a
        property: host
    - secretKey: DB_DATABASE
      remoteRef:
        key: atlas-postgres-app-a
        property: dbname
    - secretKey: DB_USERNAME
      remoteRef:
        key: atlas-postgres-app-a
        property: user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: atlas-postgres-app-a
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-credentials
        property: REDIS_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: silo-atlas-credentials
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: silo-atlas-credentials
        property: AWS_SECRET_ACCESS_KEY
