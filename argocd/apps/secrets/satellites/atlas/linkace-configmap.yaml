apiVersion: v1
kind: ConfigMap
metadata:
  name: linkace-config
  namespace: atlas
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_NAME: Atlas
  APP_URL: https://atlas.guesant.net
  TRUSTED_PROXIES: "*"
  DB_CONNECTION: pgsql
  DB_PORT: "5432"
  REDIS_HOST: redis.data.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  REDIS_CACHE_DB: "3"
  REDIS_QUEUE: linkace
  SESSION_DRIVER: redis
  CACHE_DRIVER: redis
  APP_SEARCH_DRIVER: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: s3
  BACKUP_DISK: s3
  BACKUP_ENABLED: "true"
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: atlas
  AWS_ENDPOINT: http://silo.data.svc.cluster.local:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  SSO_ENABLED: "true"
  SSO_REGISTRATION_ENABLED: "true"
  SSO_REQUIRE_VERIFIED_EMAIL: "true"
  REGULAR_LOGIN_DISABLED: "true"
  SSO_AUTO_REDIRECT: "true"
  SSO_KEYCLOAK_ENABLED: "true"
  SSO_KEYCLOAK_CLIENT_ID: linkace
  SSO_KEYCLOAK_BASE_URL: https://auth.guesant.net
  SSO_KEYCLOAK_REALM: management
