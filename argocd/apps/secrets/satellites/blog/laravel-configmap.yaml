apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: blog
data:
  ADMIN_PATH: ""
  APP_DEBUG: "false"
  APP_ENV: production
  APP_LOCALE: en
  APP_NAME: Portfolio
  APP_URL: https://guesant.net
  APP_FALLBACK_LOCALE: en
  CACHE_STORE: database
  DB_CONNECTION: pgsql
  DB_PORT: "5432"
  FILESYSTEM_DISK: local
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  OG_IMAGE_BASE_URL: https://api.guesant.net
  OG_IMAGE_ENABLED: "true"
  PHP_CLI_SERVER_WORKERS: "2"
  PORTFOLIO_ADMIN_OIDC_AUTHORITY: https://auth.guesant.net
  PORTFOLIO_ADMIN_OIDC_CLIENT_ID: blog
  PORTFOLIO_ADMIN_OIDC_GROUP: admins
  PORTFOLIO_ADMIN_OIDC_REDIRECT_URI: https://admin.guesant.net/auth/keycloak/callback
  PORTFOLIO_PUBLIC_ASSET_ROOT: /data/public
  PORTFOLIO_RESUME_PDF_ROOT: /data/resume-cache
  PUBLIC_SITE_BASE_URL: https://guesant.net
  QUEUE_CONNECTION: database
  SESSION_COOKIE: sid
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
  TECTONIC_ONLY_CACHED: "false"
