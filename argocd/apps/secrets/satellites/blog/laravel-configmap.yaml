apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: blog
data:
  ADMIN_PATH: ""
  APP_DEBUG: "false"
  APP_ENV: production
  APP_LOCALE: en
  APP_NAME: Portfolio
  APP_URL: https://guesant.net
  APP_FALLBACK_LOCALE: en
  AWS_BUCKET: portfolio
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT: http://silo.data.svc.cluster.local:9000
  AWS_TEMPORARY_URL: https://silo-s3.guesant.internal
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  CACHE_STORE: failover
  DB_CONNECTION: pgsql
  DB_PORT: "5432"
  FILESYSTEM_DISK: s3
  LIVEWIRE_TEMPORARY_FILE_UPLOAD_DISK: local
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  OG_IMAGE_BASE_URL: https://api.guesant.net
  OG_IMAGE_DISK: s3
  OG_IMAGE_ENABLED: "true"
  PHP_CLI_SERVER_WORKERS: "2"
  PORTFOLIO_ADMIN_OIDC_AUTHORITY: https://auth.guesant.net
  PORTFOLIO_ADMIN_OIDC_CLIENT_ID: blog
  PORTFOLIO_ADMIN_OIDC_GROUP: admins
  PORTFOLIO_ADMIN_OIDC_REDIRECT_URI: https://admin.guesant.net/auth/keycloak/callback
  PORTFOLIO_PUBLIC_MEDIA_URL: https://api.guesant.net/api/v1/media
  PORTFOLIO_PUBLIC_ASSET_ROOT: /data/public
  PORTFOLIO_RESUME_PDF_ROOT: /data/resume-cache
  PUBLIC_SITE_BASE_URL: https://guesant.net
  QUEUE_CONNECTION: database
  REDIS_CACHE_DB: "1"
  REDIS_HOST: redis.data.svc.cluster.local
  REDIS_PORT: "6379"
  SESSION_COOKIE: sid
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
  TECTONIC_ONLY_CACHED: "false"
