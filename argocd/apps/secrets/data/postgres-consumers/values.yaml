rotation:
  keycloak:
    activeSlot: a
  atlas:
    activeSlot: a

consumerDefaults:
  syncWave: "4"
  refreshPolicy: Periodic
  refreshInterval: 1m
  creationPolicy: Orphan
  deletionPolicy: Retain
  targetType: Opaque

consumers:
  - name: keycloak-postgres-app
    namespace: keycloak
    rotationKey: keycloak
    sourceSecretPrefix: keycloak-postgres-app
    fields:
      - secretKey: username
        property: username
      - secretKey: password
        property: password
  - name: atlas-postgres-app
    namespace: atlas
    rotationKey: atlas
    sourceSecretPrefix: atlas-postgres-app
    fields:
      - secretKey: host
        property: host
      - secretKey: dbname
        property: dbname
      - secretKey: user
        property: user
      - secretKey: password
        property: password

replication:
  serviceAccountName: secret-replication-reader
  serviceAccountNamespace: external-secrets
  externalSecretsNamespace: external-secrets
  readerRoleName: secret-replication-reader
  accessReviewName: secret-replication-access-review
  tokenCreateName: external-secrets-token-create
  controllerServiceAccountName: external-secrets
  storeName: data-secrets
  remoteNamespace: data
  namespaces:
    - blog
    - keycloak
    - atlas
  sourceSecrets:
    - keycloak-postgres-app-a
    - keycloak-postgres-app-b
    - atlas-postgres-app-a
    - atlas-postgres-app-b
    - silo-atlas-credentials
    - redis-credentials
