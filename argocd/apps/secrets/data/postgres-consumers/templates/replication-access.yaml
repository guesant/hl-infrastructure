# yamllint disable-file
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.replication.serviceAccountName }}
  namespace: {{ .Values.replication.serviceAccountNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.replication.readerRoleName }}
  namespace: {{ .Values.replication.remoteNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
{{ toYaml .Values.replication.sourceSecrets | nindent 6 }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.replication.readerRoleName }}
  namespace: {{ .Values.replication.remoteNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.replication.serviceAccountName }}
    namespace: {{ .Values.replication.serviceAccountNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.replication.readerRoleName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.replication.accessReviewName }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.replication.accessReviewName }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.replication.serviceAccountName }}
    namespace: {{ .Values.replication.serviceAccountNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.replication.accessReviewName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.replication.tokenCreateName }}
  namespace: {{ .Values.replication.externalSecretsNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - {{ .Values.replication.serviceAccountName }}
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.replication.tokenCreateName }}
  namespace: {{ .Values.replication.externalSecretsNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.replication.controllerServiceAccountName }}
    namespace: {{ .Values.replication.externalSecretsNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.replication.tokenCreateName }}
