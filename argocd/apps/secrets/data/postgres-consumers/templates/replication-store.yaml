# yamllint disable-file
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.replication.storeName }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  conditions:
    - namespaces:
{{ toYaml .Values.replication.namespaces | nindent 8 }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.replication.remoteNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .Values.replication.remoteNamespace }}
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.replication.serviceAccountName }}
          namespace: {{ .Values.replication.serviceAccountNamespace }}
