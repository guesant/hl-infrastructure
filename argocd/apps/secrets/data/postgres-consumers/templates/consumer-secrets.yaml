# yamllint disable-file
{{- range $index, $consumer := .Values.consumers }}
{{- if $index }}
---
{{- end }}
{{- $rotation := index $.Values.rotation $consumer.rotationKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $consumer.name }}
  namespace: {{ $consumer.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.consumerDefaults.syncWave | quote }}
spec:
  refreshPolicy: {{ $.Values.consumerDefaults.refreshPolicy }}
  refreshInterval: {{ $.Values.consumerDefaults.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.replication.storeName }}
  target:
    name: {{ $consumer.name }}
    creationPolicy: {{ $.Values.consumerDefaults.creationPolicy }}
    deletionPolicy: {{ $.Values.consumerDefaults.deletionPolicy }}
    template:
      type: {{ $.Values.consumerDefaults.targetType }}
  data:
{{- range $field := $consumer.fields }}
    - secretKey: {{ $field.secretKey }}
      remoteRef:
        key: {{ printf "%s-%s" $consumer.sourceSecretPrefix $rotation.activeSlot }}
        property: {{ $field.property }}
{{- end }}
{{- end }}
