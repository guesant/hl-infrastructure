clusterName: postgres

rotation:
  portfolio:
    activeSlot: a
    retiredSlot: ""
  keycloak:
    activeSlot: a
    retiredSlot: ""

roles:
  - resourceName: portfolio
    databaseName: portfolio
    kind: group
    syncWave: "1"
  - resourceName: portfolio-a
    databaseName: portfolio_a
    kind: slot
    syncWave: "2"
    rotationKey: portfolio
    slot: a
    inRoles:
      - portfolio
    passwordSecret: portfolio-postgres-app-a
  - resourceName: portfolio-b
    databaseName: portfolio_b
    kind: slot
    syncWave: "2"
    rotationKey: portfolio
    slot: b
    inRoles:
      - portfolio
    passwordSecret: portfolio-postgres-app-b
  - resourceName: keycloak
    databaseName: keycloak
    kind: group
    syncWave: "1"
  - resourceName: keycloak-a
    databaseName: keycloak_a
    kind: slot
    syncWave: "2"
    rotationKey: keycloak
    slot: a
    inRoles:
      - keycloak
    passwordSecret: keycloak-postgres-app-a
  - resourceName: keycloak-b
    databaseName: keycloak_b
    kind: slot
    syncWave: "2"
    rotationKey: keycloak
    slot: b
    inRoles:
      - keycloak
    passwordSecret: keycloak-postgres-app-b

roleDefaults:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  reclaimPolicy: retain
  groupLogin: false
  groupDisablePassword: true

consumerSecrets:
  - name: portfolio-postgres-app
    namespace: blog
    activeSlot: portfolio
    data:
      - secretKey: host
        property: host
      - secretKey: dbname
        property: dbname
      - secretKey: user
        property: user
      - secretKey: password
        property: password
  - name: keycloak-postgres-app
    namespace: keycloak
    activeSlot: keycloak
    data:
      - secretKey: username
        property: username
      - secretKey: password
        property: password

consumerSecretDefaults:
  syncWave: "4"
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreKind: ClusterSecretStore
  targetType: Opaque
  targetCreationPolicy: Orphan
  targetDeletionPolicy: Retain

replication:
  serviceAccountName: secret-replication-reader
  serviceAccountNamespace: external-secrets
  externalSecretsNamespace: external-secrets
  readerRoleName: secret-replication-reader
  accessReviewName: secret-replication-access-review
  tokenCreateName: external-secrets-token-create
  controllerServiceAccountName: external-secrets
  storeName: data-secrets
  remoteNamespace: data
  conditions:
    - blog
    - keycloak
  sourceSecrets:
    - portfolio-postgres-app-a
    - portfolio-postgres-app-b
    - keycloak-postgres-app-a
    - keycloak-postgres-app-b
  syncWave: "1"
  accessReviewRules:
    - apiGroups:
        - authorization.k8s.io
      resources:
        - selfsubjectaccessreviews
        - selfsubjectrulesreviews
      verbs:
        - create
  tokenCreateRules:
    - apiGroups:
        - ""
      resources:
        - serviceaccounts/token
      verbs:
        - create
  store:
    caConfigMapType: ConfigMap
    caConfigMapName: kube-root-ca.crt
    caConfigMapKey: ca.crt
