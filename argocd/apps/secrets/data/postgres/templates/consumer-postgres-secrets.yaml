# yamllint disable-file
{{ range $index, $consumer := .Values.consumerSecrets }}
{{ if $index }}---
{{ end }}
{{- $rotation := index $.Values.rotation $consumer.activeSlot }}
{{- $source := printf "%s-%s" $consumer.name $rotation.activeSlot }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $consumer.name }}
  namespace: {{ $consumer.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.consumerSecretDefaults.syncWave | quote }}
spec:
  refreshPolicy: {{ $.Values.consumerSecretDefaults.refreshPolicy }}
  refreshInterval: {{ $.Values.consumerSecretDefaults.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.consumerSecretDefaults.secretStoreKind }}
    name: {{ $.Values.replication.storeName }}
  target:
    name: {{ $consumer.name }}
    creationPolicy: {{ $.Values.consumerSecretDefaults.targetCreationPolicy }}
    deletionPolicy: {{ $.Values.consumerSecretDefaults.targetDeletionPolicy }}
    template:
      type: {{ $.Values.consumerSecretDefaults.targetType }}
  data:
{{- range $consumer.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $source }}
        property: {{ .property }}
{{ end }}
{{ end }}
