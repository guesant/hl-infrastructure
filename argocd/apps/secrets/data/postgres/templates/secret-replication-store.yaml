# yamllint disable-file
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.replication.storeName }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.consumerSecretDefaults.syncWave | quote }}
spec:
  conditions:
    - namespaces:
{{ toYaml .Values.replication.conditions | nindent 8 }}
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.replication.remoteNamespace }}
      server:
        caProvider:
          type: {{ .Values.replication.store.caConfigMapType }}
          name: {{ .Values.replication.store.caConfigMapName }}
          namespace: {{ .Values.replication.remoteNamespace }}
          key: {{ .Values.replication.store.caConfigMapKey }}
      auth:
        serviceAccount:
          name: {{ .Values.replication.serviceAccountName }}
          namespace: {{ .Values.replication.serviceAccountNamespace }}
# yamllint disable-file
