apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: blog
  namespace: blog-delivery
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  interval: 2m0s
  freightCreationPolicy: Automatic
  subscriptions:
    {{- range .Values.images }}
    - image:
        repoURL: {{ .imageRepo }}
        imageSelectionStrategy: Digest
        constraint: main
        strictSemvers: true
        discoveryLimit: 5
    {{- end }}
