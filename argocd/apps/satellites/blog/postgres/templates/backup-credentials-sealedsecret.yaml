apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-backup-credentials
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  encryptedData:
    ACCESS_KEY_ID: REPLACE_WITH_KUBESEAL_OUTPUT
    ACCESS_SECRET_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    type: Opaque
    metadata:
      name: postgres-backup-credentials
