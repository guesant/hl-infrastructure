{{- if and .Values.laravel.enabled .Values.laravel.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.laravel.names.scheduler }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.laravel.names.application }}
    app.kubernetes.io/component: {{ .Values.laravel.components.scheduler }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
{{ toYaml .Values.laravel.annotations | nindent 4 }}
spec:
  replicas: {{ .Values.laravel.scheduler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.laravel.names.application }}
      app.kubernetes.io/component: {{ .Values.laravel.components.scheduler }}
      application.stakater.com/workload-class: {{ .Values.laravel.workloadClasses.scheduler }}
  strategy:
{{ toYaml .Values.laravel.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.laravel.names.application }}
        app.kubernetes.io/component: {{ .Values.laravel.components.scheduler }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        application.stakater.com/workload-class: {{ .Values.laravel.workloadClasses.scheduler }}
    spec:
      automountServiceAccountToken: {{ .Values.laravel.pod.automountServiceAccountToken }}
      serviceAccountName: {{ .Values.laravel.names.serviceAccount }}
      containers:
        - name: {{ .Values.laravel.names.scheduler }}
          image: "{{ .Values.laravel.image.repository }}:{{ .Values.laravel.image.tag }}"
          imagePullPolicy: {{ .Values.laravel.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - >-
              mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private storage/app/public storage/app/resume-pdf &&
              php artisan config:cache &&
              exec php artisan schedule:work
          envFrom:
            - secretRef:
                name: {{ .Values.laravel.secretNames.bootstrap }}
            - secretRef:
                name: {{ .Values.laravel.secretNames.application }}
            - configMapRef:
                name: {{ .Values.laravel.configMapName }}
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: host
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: password
          resources:
            {{- toYaml .Values.laravel.scheduler.resources | nindent 12 }}
          securityContext:
{{ toYaml .Values.laravel.container.securityContext | nindent 12 }}
          volumeMounts:
{{ toYaml .Values.laravel.sharedVolumeMounts | nindent 12 }}
      securityContext:
{{ toYaml .Values.laravel.pod.securityContext | nindent 8 }}
      volumes:
{{- range .Values.laravel.sharedVolumes }}
        - name: {{ .name }}
{{- if eq .type "emptyDir" }}
          emptyDir: {}
{{- else if eq .type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ $.Values.resumeCache.name }}
{{- end }}
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.laravel.terminationGracePeriodSeconds }}
{{- end }}
