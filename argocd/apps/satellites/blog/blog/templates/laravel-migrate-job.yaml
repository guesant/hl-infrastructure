{{- if .Values.laravel.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: laravel-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/component: laravel
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/component: laravel
        app.kubernetes.io/instance: {{ .Release.Name }}
        application.stakater.com/workload-class: batch
    spec:
      automountServiceAccountToken: false
      serviceAccountName: app
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.laravel.image.repository }}:{{ .Values.laravel.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private storage/app/public storage/app/resume-pdf && php artisan migrate --force
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
            - secretRef:
                name: laravel-secret
          env:
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_PORT
              value: "5432"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: host
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 33
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app-storage
              mountPath: /app/storage
            - name: bootstrap-cache
              mountPath: /app/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 33
        runAsNonRoot: true
        runAsUser: 33
      volumes:
        - name: app-storage
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
