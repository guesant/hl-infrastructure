{{- if .Values.laravel.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.laravel.names.migrationJob }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.laravel.names.application }}
    app.kubernetes.io/component: {{ .Values.laravel.components.batch }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
{{ toYaml .Values.laravel.migration.hook | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.laravel.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.laravel.migration.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.laravel.names.application }}
        app.kubernetes.io/component: {{ .Values.laravel.components.batch }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        application.stakater.com/workload-class: {{ .Values.laravel.workloadClasses.batch }}
    spec:
      automountServiceAccountToken: {{ .Values.laravel.pod.automountServiceAccountToken }}
      serviceAccountName: {{ .Values.laravel.names.serviceAccount }}
      restartPolicy: {{ .Values.laravel.migration.restartPolicy }}
      containers:
        - name: {{ .Values.laravel.migration.containerName }}
          image: "{{ .Values.laravel.image.repository }}:{{ .Values.laravel.image.tag }}"
          imagePullPolicy: {{ .Values.laravel.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private storage/app/public storage/app/resume-pdf && php artisan migrate --force
          envFrom:
            - secretRef:
                name: {{ .Values.laravel.secretNames.bootstrap }}
            - secretRef:
                name: {{ .Values.laravel.secretNames.application }}
            - configMapRef:
                name: {{ .Values.laravel.configMapName }}
          env:
            - name: DB_CONNECTION
              value: {{ .Values.laravel.migration.databaseConnection }}
            - name: DB_PORT
              value: {{ .Values.laravel.migration.databasePort | quote }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: host
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretNames.database }}
                  key: password
          resources:
{{ toYaml .Values.laravel.migration.resources | nindent 12 }}
          securityContext:
{{ toYaml .Values.laravel.container.securityContext | nindent 12 }}
          volumeMounts:
{{ toYaml .Values.laravel.migrationVolumeMounts | nindent 12 }}
      securityContext:
{{ toYaml .Values.laravel.pod.securityContext | nindent 8 }}
      volumes:
{{- range .Values.laravel.migrationVolumes }}
        - name: {{ .name }}
          emptyDir: {}
{{- end }}
{{- end }}
