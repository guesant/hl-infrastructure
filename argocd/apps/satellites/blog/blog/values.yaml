application:
  applicationName: frontend
  rbac:
    serviceAccount:
      create: true
  deployment:
    enabled: true
    annotations:
      reloader.stakater.com/auto: "true"
    strategy:
      type: Recreate
      rollingUpdate: null
    replicas: 1
    reloadOnChange: false
    image:
      repository: ghcr.io/guesant/blog
      tag: main@sha256:7c819fad5bf9f904d290e001d6e093824b3f900baebed66e126403dfc479cd92
    ports:
      - containerPort: 3000
        name: http
        protocol: TCP
    envFrom:
      config:
        type: configmap
        nameSuffix: config
    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    containerSecurityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  job:
    enabled: false
  service:
    enabled: true
    ports:
      - port: 80
        name: http
        protocol: TCP
        targetPort: 3000
  configMap:
    enabled: true
    files:
      config:
        PORTFOLIO_CONTENT_API_URL: http://app:8080/api/v1/public-site
        PORTFOLIO_PUBLIC_API_URL: /api/v1

laravel:
  enabled: true
  image:
    repository: ghcr.io/guesant/blog-laravel
    tag: main@sha256:950776740b5c477419d53487f441c6727e42a55c2535828d4f9260ad9ea8143a
  env:
    APP_NAME: Portfolio
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://guesant.net
    PUBLIC_SITE_BASE_URL: https://guesant.net
    APP_LOCALE: en
    APP_FALLBACK_LOCALE: en
    LOG_CHANNEL: stderr
    LOG_LEVEL: error
    PHP_CLI_SERVER_WORKERS: "2"
    DB_CONNECTION: pgsql
    DB_PORT: "5432"
    SESSION_DRIVER: database
    SESSION_COOKIE: sid
    SESSION_SECURE_COOKIE: "true"
    FILESYSTEM_DISK: local
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    ADMIN_PATH: ""
    PORTFOLIO_ADMIN_OIDC_AUTHORITY: https://auth.guesant.net/realms/homelab
    PORTFOLIO_ADMIN_OIDC_CLIENT_ID: blog
    PORTFOLIO_ADMIN_OIDC_GROUP: admins
    PORTFOLIO_RESUME_PDF_ROOT: /data/resume-cache
    PORTFOLIO_PUBLIC_ASSET_ROOT: /data/public
    TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
    TECTONIC_ONLY_CACHED: "false"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi
  worker:
    enabled: true
    replicas: 1
    queues: default,open-graph
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 128Mi
  scheduler:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
