application:
  applicationName: frontend
  rbac:
    serviceAccount:
      create: true
  deployment:
    enabled: true
    annotations:
      reloader.stakater.com/auto: "true"
    strategy:
      type: Recreate
      rollingUpdate: null
    replicas: 1
    reloadOnChange: false
    image:
      repository: ghcr.io/guesant/blog
      tag: main@sha256:7c9a5174bee6381fc40833d42fe9fa21fff4c8bde1f2016d87fb09fce779d7f8
    ports:
      - containerPort: 3000
        name: http
        protocol: TCP
    envFrom:
      config:
        type: configmap
        nameSuffix: config
    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    startupProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    containerSecurityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  job:
    enabled: false
  service:
    enabled: true
    ports:
      - port: 80
        name: http
        protocol: TCP
        targetPort: 3000
  configMap:
    enabled: false

resumeCache:
  name: resume-cache
  namespace: blog
  size: 2Gi
  syncWave: "4"
  accessModes:
    - ReadWriteOnce

laravel:
  enabled: true
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: "4"
  strategy:
    type: Recreate
  pod:
    automountServiceAccountToken: false
    securityContext:
      fsGroup: 33
      runAsNonRoot: true
      runAsUser: 33
  container:
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 33
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  components:
    serving: laravel
    worker: laravel-worker
    scheduler: laravel-scheduler
    batch: laravel
  workloadClasses:
    serving: serving
    worker: worker
    scheduler: scheduler
    batch: batch
  serviceAccount:
    automountServiceAccountToken: false
  serviceType: ClusterIP
  servicePortName: http
  serviceProtocol: TCP
  sharedVolumeMounts:
    - name: app-storage
      mountPath: /app/storage
    - name: bootstrap-cache
      mountPath: /app/bootstrap/cache
    - name: public-assets
      mountPath: /data/public
    - name: resume-cache
      mountPath: /data/resume-cache
    - name: tmp
      mountPath: /tmp
  migrationVolumeMounts:
    - name: app-storage
      mountPath: /app/storage
    - name: bootstrap-cache
      mountPath: /app/bootstrap/cache
    - name: tmp
      mountPath: /tmp
  sharedVolumes:
    - name: app-storage
      type: emptyDir
    - name: bootstrap-cache
      type: emptyDir
    - name: public-assets
      type: emptyDir
    - name: resume-cache
      type: persistentVolumeClaim
      claimName: resume-cache
    - name: tmp
      type: emptyDir
  migrationVolumes:
    - name: app-storage
      type: emptyDir
    - name: bootstrap-cache
      type: emptyDir
    - name: tmp
      type: emptyDir
  terminationGracePeriodSeconds: 30
  probeDefaults:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 1
    failureThreshold: 3
  migration:
    containerName: migrate
    restartPolicy: OnFailure
    activeDeadlineSeconds: 600
    backoffLimit: 3
    databaseConnection: pgsql
    databasePort: "5432"
    hook:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  names:
    application: app
    deployment: laravel
    migrationJob: laravel-migrate
    scheduler: laravel-scheduler
    worker: laravel-worker
    service: app
    serviceAccount: app
  secretNames:
    bootstrap: app-secret
    application: laravel-secret
    ogImage: og-secret
    database: portfolio-postgres-app
  configMapName: laravel-config
  imagePullPolicy: IfNotPresent
  port: 8000
  service:
    port: 8080
    targetPort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  image:
    repository: ghcr.io/guesant/blog-laravel
    tag: main@sha256:2dbfa2f4588237c73737dd88afc0856bfb14a8a348ec665021d10e47dc36a571
  replicas: 2
  worker:
    enabled: true
    replicas: 1
    queues: default
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 400m
        memory: 128Mi
  scheduler:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
