application:
  applicationName: app
  deployment:
    replicas: 1
    reloadOnChange: false
    image:
      repository: ghcr.io/guesant/blog
      tag: sha-0000000000000000000000000000000000000000
    command:
      - /bin/sh
      - -c
      - |
        export PORTFOLIO_DB_CONNECTION="Host=$(cat /secrets/db/host);Database=$(cat /secrets/db/dbname);Username=$(cat /secrets/db/user);Password=$(cat /secrets/db/password)"
        exec /app/entrypoint.prod.sh
    ports:
      - containerPort: 8080
    envFrom:
      config:
        type: configmap
        nameSuffix: config
      secret:
        type: secret
        nameSuffix: secret
    volumes:
      db-credentials:
        secret:
          secretName: postgres-app
      public-assets:
        emptyDir: {}
      resume-cache:
        emptyDir: {}
    volumeMounts:
      db-credentials:
        mountPath: /secrets/db
        readOnly: true
      public-assets:
        mountPath: /data/public
      resume-cache:
        mountPath: /data/resume-cache
    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 8080
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1654
    containerSecurityContext:
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  service:
    ports:
      - port: 80
        name: http
        protocol: TCP
        targetPort: 8080
  configMap:
    enabled: true
    files:
      config:
        PUBLIC_SITE_BASE_URL: https://blog.example.invalid
        TECTONIC_BUNDLE: https://data1.fullyjustified.net/tlextras-2022.0r0.tar
        PORTFOLIO_ADMIN_GOOGLE_CLIENT_ID: ""
        PORTFOLIO_ADMIN_GOOGLE_EMAIL: ""
