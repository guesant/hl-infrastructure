application:
  applicationName: cloudflared
  deployment:
    replicas: 1
    reloadOnChange: false
    image:
      repository: cloudflare/cloudflared
      tag: 2026.8.3
      digest: sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    args:
      - tunnel
      - --config
      - /etc/cloudflared/config/config.yaml
      - run
    volumes:
      config:
        configMap:
          name: '{{ include "application.name" $ }}-config'
      creds:
        secret:
          secretName: cloudflared-secret
    volumeMounts:
      config:
        mountPath: /etc/cloudflared/config
        readOnly: true
      creds:
        mountPath: /etc/cloudflared/creds
        readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    containerSecurityContext:
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  service:
    enabled: false
  configMap:
    enabled: true
    files:
      config:
        config.yaml: |
          tunnel: REPLACE_WITH_TUNNEL_ID
          credentials-file: /etc/cloudflared/creds/credentials.json
          ingress:
            - hostname: blog.example.invalid
              path: /api/webhook
              service: http://argocd-server.argocd.svc.cluster.local:80
            - hostname: blog.example.invalid
              service: http://app.blog.svc.cluster.local
            - service: http_status:404
