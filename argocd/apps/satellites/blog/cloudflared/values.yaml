application:
  applicationName: cloudflared
  rbac:
    serviceAccount:
      create: true
  deployment:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 1
    reloadOnChange: false
    image:
      repository: cloudflare/cloudflared
      tag: 2026.8.3
      digest: sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    args:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /etc/cloudflared/creds/token
    volumes:
      creds:
        secret:
          secretName: cloudflared-secret
    volumeMounts:
      creds:
        mountPath: /etc/cloudflared/creds
        readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    containerSecurityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  service:
    enabled: false
  configMap:
    enabled: false
