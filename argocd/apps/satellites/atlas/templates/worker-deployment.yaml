# yamllint disable-file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkace-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: linkace
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: linkace
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkace
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        atlas.guesant.net/config-revision: {{ .Values.configRevision | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
{{ toYaml .Values.security.pod | nindent 8 }}
      initContainers:
        - name: prepare-storage
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - mkdir -p /app/storage/framework/cache/data /app/storage/framework/sessions /app/storage/framework/views /app/storage/logs /app/storage/app/private /app/storage/app/public /app/storage/app/resume-pdf
          securityContext:
{{ toYaml .Values.security.container | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      containers:
        - name: worker
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - php
            - artisan
            - queue:work
            - --queue=import,linkace,default
            - --sleep=3
            - --tries=3
            - --max-time=3600
          envFrom:
            - configMapRef:
                name: linkace-config
            - secretRef:
                name: linkace-env
            - secretRef:
                name: atlas-runtime-credentials
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          securityContext:
{{ toYaml .Values.security.container | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: bootstrap-cache
              mountPath: /app/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          emptyDir:
            sizeLimit: {{ .Values.storage.logsSize }}
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
