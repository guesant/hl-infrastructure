# yamllint disable-file
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo-network-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo
      app.kubernetes.io/component: object-storage
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: blog
            app.kubernetes.io/name: app
      toPorts:
        - ports:
            - port: {{ .Values.service.s3Port | quote }}
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: silo-policy-job
      toPorts:
        - ports:
            - port: {{ .Values.service.s3Port | quote }}
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ .Values.service.s3Port | quote }}
              protocol: TCP
            - port: {{ .Values.service.consolePort | quote }}
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
