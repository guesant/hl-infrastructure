# yamllint disable-file
apiVersion: v1
kind: ConfigMap
metadata:
  name: silo-policies
  annotations:
    silo.guesant.net/policy-revision: oidc-only
data:
  admins.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": ["admin:*"]},
        {"Effect": "Allow", "Action": ["kms:*"]},
        {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::*"]},
        {"Effect": "Allow", "Action": ["s3tables:*"], "Resource": ["arn:aws:s3tables:::*"]}
      ]
    }
  portfolio.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::portfolio"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::portfolio/*"
          ]
        }
      ]
    }
