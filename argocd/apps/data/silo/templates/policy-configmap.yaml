# yamllint disable-file
apiVersion: v1
kind: ConfigMap
metadata:
  name: silo-policies
  annotations:
    silo.guesant.net/policy-revision: browser-upload-v1
data:
  admins.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": ["admin:*"]},
        {"Effect": "Allow", "Action": ["kms:*"]},
        {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::*"]},
        {"Effect": "Allow", "Action": ["s3tables:*"], "Resource": ["arn:aws:s3tables:::*"]}
      ]
    }
  portfolio.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::portfolio"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::portfolio/*"
          ]
        }
      ]
    }
  portfolio-cors.xml: |-
    <CORSConfiguration>
      <CORSRule>
        <AllowedOrigin>https://admin.guesant.net</AllowedOrigin>
        <AllowedMethod>GET</AllowedMethod>
        <AllowedMethod>HEAD</AllowedMethod>
        <AllowedMethod>PUT</AllowedMethod>
        <AllowedMethod>POST</AllowedMethod>
        <AllowedHeader>*</AllowedHeader>
        <ExposeHeader>ETag</ExposeHeader>
        <MaxAgeSeconds>3600</MaxAgeSeconds>
      </CORSRule>
    </CORSConfiguration>
