# yamllint disable-file
apiVersion: v1
kind: ConfigMap
metadata:
  name: silo-policies
data:
  portfolio.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::portfolio"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::portfolio/*"
          ]
        }
      ]
    }
