# yamllint disable-file
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo-policy-job-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo-policy-job
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: silo
            app.kubernetes.io/component: object-storage
      toPorts:
        - ports:
            - port: {{ .Values.service.s3Port | quote }}
              protocol: TCP
