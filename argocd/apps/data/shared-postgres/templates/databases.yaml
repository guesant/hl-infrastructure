# yamllint disable-file
{{ range $index, $database := .Values.databases }}
{{ if $index }}---
{{ end }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $database.name }}
  annotations:
{{ toYaml $.Values.databaseDefaults.annotations | nindent 4 }}
spec:
  cluster:
    name: {{ $.Values.cluster.name }}
  name: {{ $database.name }}
  owner: {{ $database.owner }}
  databaseReclaimPolicy: {{ $.Values.databaseDefaults.reclaimPolicy }}
{{ end }}
# yamllint disable-file
