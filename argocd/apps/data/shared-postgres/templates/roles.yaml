# yamllint disable-file
{{ if and (ne .Values.rotation.portfolio.activeSlot "a") (ne .Values.rotation.portfolio.activeSlot "b") }}
{{ fail "rotation.portfolio.activeSlot must be a or b" }}
{{ end }}
{{ if and (ne .Values.rotation.keycloak.activeSlot "a") (ne .Values.rotation.keycloak.activeSlot "b") }}
{{ fail "rotation.keycloak.activeSlot must be a or b" }}
{{ end }}
{{ if and (ne (default "" .Values.rotation.portfolio.retiredSlot) "") (ne .Values.rotation.portfolio.retiredSlot "a") (ne .Values.rotation.portfolio.retiredSlot "b") }}
{{ fail "rotation.portfolio.retiredSlot must be empty, a or b" }}
{{ end }}
{{ if and (ne (default "" .Values.rotation.keycloak.retiredSlot) "") (ne .Values.rotation.keycloak.retiredSlot "a") (ne .Values.rotation.keycloak.retiredSlot "b") }}
{{ fail "rotation.keycloak.retiredSlot must be empty, a or b" }}
{{ end }}
{{ if and (ne (default "" .Values.rotation.portfolio.retiredSlot) "") (eq .Values.rotation.portfolio.retiredSlot .Values.rotation.portfolio.activeSlot) }}
{{ fail "rotation.portfolio.retiredSlot cannot be the active slot" }}
{{ end }}
{{ if and (ne (default "" .Values.rotation.keycloak.retiredSlot) "") (eq .Values.rotation.keycloak.retiredSlot .Values.rotation.keycloak.activeSlot) }}
{{ fail "rotation.keycloak.retiredSlot cannot be the active slot" }}
{{ end }}
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: postgres
  name: portfolio
  login: false
  disablePassword: true
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: portfolio-a
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: postgres
  name: portfolio_a
  login: {{ ne (default "" .Values.rotation.portfolio.retiredSlot) "a" }}
  inRoles:
    - portfolio
  passwordSecret:
    name: portfolio-postgres-app-a
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: portfolio-b
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: postgres
  name: portfolio_b
  login: {{ ne (default "" .Values.rotation.portfolio.retiredSlot) "b" }}
  inRoles:
    - portfolio
  passwordSecret:
    name: portfolio-postgres-app-b
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: postgres
  name: keycloak
  login: false
  disablePassword: true
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak-a
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: postgres
  name: keycloak_a
  login: {{ ne (default "" .Values.rotation.keycloak.retiredSlot) "a" }}
  inRoles:
    - keycloak
  passwordSecret:
    name: keycloak-postgres-app-a
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak-b
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: postgres
  name: keycloak_b
  login: {{ ne (default "" .Values.rotation.keycloak.retiredSlot) "b" }}
  inRoles:
    - keycloak
  passwordSecret:
    name: keycloak-postgres-app-b
  databaseRoleReclaimPolicy: retain
