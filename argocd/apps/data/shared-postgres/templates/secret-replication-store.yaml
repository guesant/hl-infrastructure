apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: data-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  conditions:
    - namespaces:
        - blog
        - keycloak
  provider:
    kubernetes:
      remoteNamespace: data
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: data
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-replication-reader
          namespace: external-secrets
