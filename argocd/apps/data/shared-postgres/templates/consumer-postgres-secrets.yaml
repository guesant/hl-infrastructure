# yamllint disable-file
{{ $portfolioSource := "portfolio-postgres-app" }}
{{ if ne .Values.rotation.portfolio.activeSlot "legacy" }}
{{ $portfolioSource = printf "portfolio-postgres-app-%s" .Values.rotation.portfolio.activeSlot }}
{{ end }}
{{ $keycloakSource := "keycloak-postgres-app" }}
{{ if ne .Values.rotation.keycloak.activeSlot "legacy" }}
{{ $keycloakSource = printf "keycloak-postgres-app-%s" .Values.rotation.keycloak.activeSlot }}
{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-postgres-app
  namespace: blog
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: data-secrets
  target:
    name: portfolio-postgres-app
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: host
      remoteRef:
        key: {{ $portfolioSource }}
        property: host
    - secretKey: dbname
      remoteRef:
        key: {{ $portfolioSource }}
        property: dbname
    - secretKey: user
      remoteRef:
        key: {{ $portfolioSource }}
        property: user
    - secretKey: password
      remoteRef:
        key: {{ $portfolioSource }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-postgres-app
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: data-secrets
  target:
    name: keycloak-postgres-app
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: {{ $keycloakSource }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $keycloakSource }}
        property: password
