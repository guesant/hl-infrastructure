# yamllint disable-file
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  annotations:
{{ toYaml .Values.cluster.annotations | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}
  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess }}
  imageName: {{ .Values.cluster.image.repository }}:{{ .Values.cluster.image.tag }}@{{ .Values.cluster.image.digest }}
  storage:
{{ toYaml .Values.cluster.storage | nindent 4 }}
  bootstrap:
    initdb:
{{ toYaml .Values.cluster.bootstrap | nindent 6 }}
  resources:
{{ toYaml .Values.cluster.resources | nindent 4 }}
# yamllint disable-file
