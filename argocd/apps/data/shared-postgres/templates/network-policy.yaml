# yamllint disable-file
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.databaseClientsName }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.cluster.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
{{ range .Values.networkPolicy.databaseClients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
{{ toYaml .selector | nindent 14 }}
{{ end }}
      ports:
        - protocol: {{ .Values.networkPolicy.databaseProtocol }}
          port: {{ .Values.networkPolicy.databasePort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.operatorName }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.cluster.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace }}
      ports:
{{ toYaml .Values.networkPolicy.operatorPorts | nindent 8 }}
# yamllint disable-file
