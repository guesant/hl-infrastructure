cluster:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  instances: 1
  enableSuperuserAccess: false
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.11"
    digest: sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi
rotation:
  keycloak:
    retiredSlot: ""
  atlas:
    retiredSlot: ""
databases:
  - name: keycloak
    owner: keycloak
  - name: atlas
    owner: atlas
databaseDefaults:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  reclaimPolicy: retain
databaseRoleDefaults:
  syncOptions: Prune=false,Delete=false
  reclaimPolicy: retain
databaseRoles:
  - resourceName: keycloak
    roleName: keycloak
    syncWave: "1"
    login: false
    disablePassword: true
  - resourceName: keycloak-a
    roleName: keycloak_a
    syncWave: "2"
    rotationKey: keycloak
    slot: a
    parentRole: keycloak
    passwordSecret: keycloak-postgres-app-a
  - resourceName: keycloak-b
    roleName: keycloak_b
    syncWave: "2"
    rotationKey: keycloak
    slot: b
    parentRole: keycloak
    passwordSecret: keycloak-postgres-app-b
  - resourceName: atlas
    roleName: atlas
    syncWave: "1"
    login: false
    disablePassword: true
  - resourceName: atlas-a
    roleName: atlas_a
    syncWave: "2"
    rotationKey: atlas
    slot: a
    parentRole: atlas
    passwordSecret: atlas-postgres-app-a
  - resourceName: atlas-b
    roleName: atlas_b
    syncWave: "2"
    rotationKey: atlas
    slot: b
    parentRole: atlas
    passwordSecret: atlas-postgres-app-b
networkPolicy:
  databaseClientsName: allow-database-clients
  operatorName: allow-cnpg-operator-to-database
  databaseClients:
    - namespace: keycloak
      selector:
        app.kubernetes.io/name: keycloak
    - namespace: atlas
      selector:
        app.kubernetes.io/name: linkace
  operatorNamespace: cnpg-system
  databasePort: 5432
  databaseProtocol: TCP
  operatorPorts:
    - port: 8000
      protocol: TCP
    - port: 9187
      protocol: TCP
