# yamllint disable-file
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-applications
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: blog
          podSelector:
            matchLabels:
              app.kubernetes.io/name: app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas
          podSelector:
            matchLabels:
              app.kubernetes.io/name: linkace
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
